<h1>스튜디오 관리 UX 하니스</h1>
<p>실제 core.js·hud.js·posts.js·github.js 를 올리고 net·datamap·engine 만 스텁. 결과는 아래와 콘솔.</p>
<div id="log"></div>

<script src="../assets/studio/core.js"></script>
<script>
(function () {
  var Y = window.YStudio;
  window.__ghConns = [];          // ghlist/ghadd/ghuse/ghdel 스텁의 연결 목록
  Y.session.set({ passcode: 'test', author: '테스트', headSha: 'aaaa111aaaa111aaaa111aaaa111aaaa111aaaa1', ts: Date.now() });

  Y.engine = {
    flush: function () { return Promise.resolve(); },
    headSha: function () { return 'aaaa111aaaa111aaaa111aaaa111aaaa111aaaa1'; },
    setHeadSha: function (s) { window.__setHead = s; },
    path: function () { return 'G-news.html'; },
    mapped: function () { return true; },
    markPublished: function () { return Promise.resolve(); },
    liveDoc: function () { return document; },
    liveWin: function () { return window; },
    map: function () { return null; },
    current: function () { return null; },
    dirty: function () { return false; }
  };

  Y.net = {
    auth: function () {
      /* 활성 연결이 있으면 그 값을 돌려준다 — 변경 → 카드 갱신 흐름을 검사하기 위함 */
      var active = (window.__ghConns || []).filter(function (e) { return e.active; })[0];
      return Promise.resolve({
        ok: true,
        branch: active ? active.branch : 'main',
        basePath: active ? active.basePath : 'design-candidates',
        headSha: active ? 'c0ffee1c0ffee1c0ffee1c0ffee1c0ffee1c0ff' : '5de2897bbbb222bbbb222bbbb222bbbb222bbbb2',
        repo: active ? active.repo : 'todo0157/yonsei-me-homepage-competition',
        repoUrl: 'https://github.com/' + (active ? active.repo : 'todo0157/yonsei-me-homepage-competition'),
        source: active ? 'custom' : 'env', canStore: true, tokenSet: !!(active && active.tokenSet)
      });
    },
    call: function (action, payload) {
      function pay() {
        var active = window.__ghConns.filter(function (e) { return e.active; })[0];
        return {
          ok: true, canStore: true, source: active ? 'custom' : 'env',
          envRepo: 'todo0157/yonsei-me-homepage-competition', envBranch: 'main',
          items: window.__ghConns.map(function (e) { return Object.assign({}, e); })
        };
      }
      if (action === 'ghlist') return Promise.resolve(pay());
      if (action === 'ghadd') {
        window.__ghadd = payload;
        window.__ghConns.forEach(function (e) { if (payload.use) e.active = false; });
        window.__ghConns.push({
          id: 'id-' + (window.__ghConns.length + 1),
          repo: payload.owner + '/' + payload.repo, branch: payload.branch,
          basePath: payload.basePath, tokenSet: !!payload.token, active: !!payload.use
        });
        var p1 = pay(); p1.headSha = 'c0ffee1c0ffee1c0ffee1c0ffee1c0ffee1c0ff';
        return Promise.resolve(p1);
      }
      if (action === 'ghuse') {
        window.__ghuse = payload;
        window.__ghConns.forEach(function (e) { e.active = e.id === payload.id; });
        var p2 = pay(); p2.headSha = 'c0ffee1c0ffee1c0ffee1c0ffee1c0ffee1c0ff';
        return Promise.resolve(p2);
      }
      if (action === 'ghdel') {
        window.__ghdel = payload;
        var wasActive = window.__ghConns.some(function (e) { return e.id === payload.id && e.active; });
        window.__ghConns = window.__ghConns.filter(function (e) { return e.id !== payload.id; });
        var p3 = pay(); p3.resetToEnv = wasActive;
        return Promise.resolve(p3);
      }
      if (action === 'ghreset') {
        window.__ghreset = true;
        window.__ghConns.forEach(function (e) { e.active = false; });
        return Promise.resolve(pay());
      }
      return Promise.reject(new Error('unknown ' + action));
    },
    history: function () {
      return Promise.resolve({ commits: [
        { sha: 'aaa9999ffffffff', message: '게시 취소: YSME 게시: assets/js/data.js (qwer1234) (5de2897, 테스트)', author: '테스트', date: new Date(Date.now() - 60000).toISOString(), html_url: 'https://github.com/x/c/0' },
        { sha: '5de2897ffffffff', message: 'YSME 게시: assets/js/data.js (qwer1234)', author: 'qwer1234', date: new Date(Date.now() - 360000).toISOString(), html_url: 'https://github.com/x/c/1' },
        { sha: '91bef3dffffffff', message: 'chore(auto): Vercel 배포 트리거 [auto-deploy-trigger]', author: '권창한', date: new Date(Date.now() - 400000).toISOString(), html_url: 'https://github.com/x/c/2' },
        { sha: '63d08d1ffffffff', message: '구독 확인 — 신청 폼 대신 전용 화면', author: 'Seoyuning', date: new Date(Date.now() - 4000000).toISOString(), html_url: 'https://github.com/x/c/3' }
      ] });
    },
    commit: function () { return Promise.reject(new Error('하니스에서는 게시하지 않습니다')); }
  };

  var SHAPE = [
    { key: 'no', kind: 'string' }, { key: 'title', kind: 'string' }, { key: 'date', kind: 'string' },
    { key: 'url', kind: 'string' }, { key: 'att', kind: 'bool' }, { key: 'bodyKind', kind: 'string' },
    { key: 'attName', kind: 'string' }, { key: 'body', kind: 'string' }
  ];
  Y.datamap = {
    load: function () { return Promise.resolve(); },
    shapeOf: function () { return SHAPE.slice(); },
    items: function () {
      return [
        { index: 0, item: { no: '공지', title: '기존 공지 예시', date: '2026.08.01', att: true }, pending: false },
        { index: 1, item: { no: 730, title: '번호 있는 글', date: '2026.07.15' }, pending: false }
      ];
    },
    addItem: function (coll, obj) { window.__added = { coll: coll, obj: obj }; return Promise.resolve(0); },
    removeItem: function () { return Promise.resolve(); }
  };
})();
</script>
<script src="../assets/studio/hud.js"></script>
<script src="../assets/studio/posts.js"></script>
<script src="../assets/studio/github.js"></script>
<script src="../assets/studio/source.js"></script>
<script src="../assets/studio/align.js"></script>
<script>
(function () {
  var Y = window.YStudio;
  var logEl = document.getElementById('log');
  var results = [];
  function t(name, ok, detail) {
    results.push({ name: name, ok: !!ok });
    var p = document.createElement('p');
    p.innerHTML = (ok ? '<b>PASS</b> ' : '<i>FAIL</i> ') + name + (detail ? ' — ' + detail : '');
    logEl.appendChild(p);
    console.log((ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' — ' + detail : ''));
  }
  function q(s, r) { return (r || document).querySelector(s); }
  function qa(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  window.__run = (async function () {
    await sleep(300);                       // 패널 등록(150ms 폴링) 대기
    /* 지난 실행이 남긴 초안 비우기 — IndexedDB 는 새로고침을 넘어 산다 */
    var old = await Y.store.all('drafts');
    await Promise.all((old || []).map(function (d) { return Y.store.del('drafts', d.path); }));
    Y.hud.mount();
    await sleep(120);

    /* 1. 스택 — 게시 없음 · 깃헙 있음, 패널 푸터에 게시 */
    var labels = qa('.ys-stack .ys-btn .ys-btn-tx').map(function (n) { return n.textContent; });
    t('스택에 게시 버튼 없음', labels.indexOf('게시') < 0, labels.join('/'));
    t('스택에 깃헙 버튼 있음', labels.indexOf('깃헙') >= 0);
    t('패널 푸터 게시 버튼', !!q('.ys-panel-foot .ys-pubfoot'));

    /* 2. 글등록 패널 — 차례·본문 큰 칸·본문형태 없음·첨부 묶음 */
    Y.hud.openPanel('post');
    await sleep(250);
    var panel = q('[data-ys-panel="post"]');
    var fLabels = qa('.ys-post-f > span', panel).map(function (n) { return n.firstChild ? n.firstChild.textContent : n.textContent; });
    /* fLabels[0]은 게시판 고르기(분류) — 입력 칸 차례는 그 다음부터 본다 */
    t('입력 차례 제목→날짜→…→본문', fLabels.slice(1, 5).join('/') === '제목/날짜/번호/본문', fLabels.join('/'));
    t('본문 큰 칸(is-tall)', !!q('.ys-ta.is-tall', panel));
    t('본문 형태 칸 없음', fLabels.join('/').indexOf('본문 형태') < 0);
    t('원문 링크 칸 없음', fLabels.join('/').indexOf('원문 링크') < 0, fLabels.join('/'));
    var attChk = q('.ys-post-chk input', panel);
    var attGrp = q('.ys-post-attg', panel);
    t('첨부 묶음 존재·처음엔 접힘', attGrp && attGrp.style.display === 'none');

    /* 3. 첨부 켜고 파일 올리기 */
    attChk.click();
    t('첨부 켜면 묶음 열림', attGrp.style.display !== 'none');
    var fileInp = q('input[type="file"]', panel);
    var dt = new DataTransfer();
    dt.items.add(new File([new Uint8Array(2048)], '테스트 안내문, 최종.pdf', { type: 'application/pdf' }));
    dt.items.add(new File([new Uint8Array(1024)], '참가 신청서.hwp'));
    fileInp.files = dt.files;
    fileInp.dispatchEvent(new Event('change'));
    await sleep(300);
    var chips = qa('.ys-post-upc', panel);
    t('파일 2개 칩 표시', chips.length === 2, chips.length + '개');
    var nameWrap = qa('.ys-post-attg .ys-post-f', panel).filter(function (w) {
      return w.textContent.indexOf('첨부 이름만') >= 0;
    })[0];
    t('파일 올리면 이름 칸 접힘', nameWrap && nameWrap.style.display === 'none');

    /* 4. 등록 — 문단 보존·bodyKind 자동·attFiles 짝 */
    var tas = qa('.ys-ta', panel);
    var titleTa = tas[0], bodyTa = q('.ys-ta.is-tall', panel);
    titleTa.value = '하니스 테스트 공지';
    bodyTa.value = '첫 문단입니다.\n\n둘째 문단입니다.\n셋째 줄.';
    var addBtn = qa('.ys-post-act .ys-act', panel).filter(function (b) { return b.textContent === '등록'; })[0];
    addBtn.click();
    await sleep(350);
    var A = window.__added && window.__added.obj;
    t('등록 호출됨', !!A);
    if (A) {
      t('본문 문단 보존', A.body === '첫 문단입니다.\n\n둘째 문단입니다.\n셋째 줄.', JSON.stringify(A.body));
      t('bodyKind 자동 text', A.bodyKind === 'text', A.bodyKind);
      t('att 자동 켜짐', A.att === true);
      t('attName = 원래 이름', A.attName === '테스트 안내문, 최종.pdf, 참가 신청서.hwp', A.attName);
      var okAf = /^assets\/files\/[a-z0-9]+-1\.pdf>테스트 안내문, 최종\.pdf\|assets\/files\/[a-z0-9]+-2\.hwp>참가 신청서\.hwp$/.test(A.attFiles || '');
      t('attFiles 경로>이름|… 형식', okAf, A.attFiles);
    }
    var drafts = await Y.store.all('drafts');
    var staged = (drafts || []).filter(function (d) { return d.encoding === 'base64' && /^assets\/files\//.test(d.path); });
    t('첨부 base64 초안 2건', staged.length === 2, staged.map(function (d) { return d.path; }).join(', '));
    await sleep(400);
    var cnt = q('.ys-pubfoot-c');
    t('푸터에 초안 개수 표시', /미게시 초안 \d+건/.test(cnt.textContent), cnt.textContent);
    /* 게시 아래 「초안 모두 삭제」 — 초안이 있을 때만, 누르면 확인 모달(하니스는 취소) */
    var dropB = q('.ys-dropfoot');
    t('초안 있으면 「초안 모두 삭제」 표시', dropB && dropB.style.display !== 'none');
    dropB.click();
    await sleep(300);
    var delCfm = q('.ys-modal');
    t('삭제 확인 모달', delCfm && delCfm.textContent.indexOf('모두 삭제할까요') >= 0);
    var delCancel = delCfm && qa('.ys-modal-f button', delCfm).filter(function (b) { return !b.classList.contains('is-pri'); })[0];
    if (delCancel) delCancel.click();
    await sleep(150);

    /* 5. 본문 없으면 bodyKind=file */
    window.__added = null;
    var tas2 = qa('.ys-ta', q('[data-ys-panel="post"]'));
    tas2[0].value = '본문 없는 공지';
    var addBtn2 = qa('.ys-post-act .ys-act', q('[data-ys-panel="post"]')).filter(function (b) { return b.textContent === '등록'; })[0];
    addBtn2.click();
    await sleep(300);
    t('본문 없으면 bodyKind=file', window.__added && window.__added.obj.bodyKind === 'file',
      window.__added && window.__added.obj.bodyKind);

    /* 6. 번호 자동 다음번호 — 최고 번호 730 → 기본값 731 */
    var noWrap = qa('.ys-post-f', q('[data-ys-panel="post"]')).filter(function (w) {
      var s = w.querySelector('span');
      return s && s.firstChild && s.firstChild.textContent === '번호';
    })[0];
    t('번호 기본값 = 다음 번호(731)', noWrap && noWrap.querySelector('input').value === '731',
      noWrap && noWrap.querySelector('input').value);

    /* 7. 화면 하단 게시 버튼 — 패널 열림=숨김 · 닫힘+초안=표시 · 클릭=게시 모달 */
    var bar = q('.ys-pubbar');
    t('패널 열려 있으면 하단 게시 숨김', bar && !bar.classList.contains('is-on'));
    Y.hud.closePanel();
    await sleep(150);
    t('패널 닫고 초안 있으면 하단 게시 표시', bar.classList.contains('is-on') && /미게시 초안 \d+건/.test(bar.textContent), bar.textContent);
    bar.click();
    await sleep(400);
    var pubModal = q('.ys-modal');
    t('하단 게시 → 게시 모달(첨부 초안 목록)', pubModal && pubModal.textContent.indexOf('assets/files/') >= 0);
    var cancelB = qa('.ys-modal-f button', pubModal).filter(function (b) { return !b.classList.contains('is-pri'); })[0];
    if (cancelB) cancelB.click();
    await sleep(150);

    /* 8. 깃헙 관리 패널 */
    Y.hud.openPanel('github');
    await sleep(350);
    var gh = q('[data-ys-panel="github"]');
    t('저장소 이름·링크', !!qa('.ys-gh-lnk', gh).filter(function (a) { return a.textContent.indexOf('todo0157/') === 0; }).length);
    var histTexts = qa('.ys-gh-c-m', gh).map(function (n) { return n.textContent; }).join(' | ');
    t('이력에 트리거 커밋 제외', histTexts.indexOf('auto-deploy-trigger') < 0 && histTexts.indexOf('YSME 게시') >= 0, histTexts);
    var chkBtn = qa('.ys-gh-act .ys-act', gh)[0];
    chkBtn.click();
    await sleep(250);
    t('연결 다시 확인 → 기준점 갱신', window.__setHead === '5de2897bbbb222bbbb222bbbb222bbbb222bbbb2', String(window.__setHead).slice(0, 7));

    /* 9. 최근 커밋 — 취소 기록·취소된 게시 구분 */
    var rowsEls = qa('.ys-gh-c', gh);
    var cancelRow = rowsEls.filter(function (r) { return !!r.querySelector('.ys-gh-tag.is-cancel'); })[0];
    t('취소 기록 표식', !!cancelRow);
    t('취소 기록 버튼 = 재게시 문구', cancelRow && /취소를 되돌리기/.test((cancelRow.querySelector('.ys-gh-rv') || {}).textContent || ''));
    var undoneRow = rowsEls.filter(function (r) { return !!r.querySelector('.ys-gh-tag.is-undone'); })[0];
    t('취소된 게시 표식(5de2897 줄)', undoneRow && undoneRow.textContent.indexOf('YSME 게시') >= 0);
    t('취소된 게시엔 버튼 없음', undoneRow && !undoneRow.querySelector('.ys-gh-rv'));
    var plainRow = rowsEls.filter(function (r) { return !r.querySelector('.ys-gh-tag') && r.querySelector('.ys-gh-rv'); })[0];
    t('보통 게시 버튼 = 이 게시 되돌리기', plainRow && plainRow.querySelector('.ys-gh-rv').textContent === '이 게시 되돌리기');
    if (plainRow) {
      plainRow.querySelector('.ys-gh-rv').click();
      await sleep(200);
      var rvCfm = q('.ys-modal');
      t('게시 취소 확인 모달', rvCfm && rvCfm.textContent.indexOf('게시를 취소합니다') >= 0);
      var rvCancel = rvCfm && qa('.ys-modal-f button', rvCfm).filter(function (b) { return !b.classList.contains('is-pri'); })[0];
      if (rvCancel) rvCancel.click();
      await sleep(150);
    }

    /* 10. 깃헙 연결 변경 — 폼(현재 값 채움) → 변경 → 카드 갱신 → 기본으로 되돌리기 */
    var changeBtn = qa('.ys-gh-act .ys-act', gh).filter(function (b) { return b.textContent.indexOf('깃헙 연결 변경') >= 0; })[0];
    t('연결 변경 버튼이 위 버튼 줄에', !!changeBtn);
    changeBtn.click();
    var form = q('.ys-gh-form', gh);
    var modeBtns = qa('.ys-gh-mode button', form).filter(function (b) { return b.textContent.indexOf('기본(') < 0; });
    t('변경 폼 = 방법 버튼 둘만', form && form.style.display !== 'none'
      && modeBtns.length === 2 && modeBtns[0].textContent === '직접 추가하기' && modeBtns[1].textContent === '링크 붙여넣기'
      && q('.ys-gh-fields', form).style.display === 'none' && q('.ys-gh-url', form).style.display === 'none',
      modeBtns.map(function (b) { return b.textContent; }).join('/'));
    /* 직접 추가하기 → 현재 값이 채워진 칸 전부.
       칸 차례: [0]주소 [1]소유자 [2]저장소 [3]브랜치 [4]사이트 폴더 [5]토큰 */
    modeBtns[0].click();
    var ins = qa('input.ys-in', form);
    t('직접 추가 = 칸 전부·현재 값', q('.ys-gh-fields', form).style.display !== 'none'
      && ins[1].value === 'todo0157' && ins[2].value === 'yonsei-me-homepage-competition'
      && ins[4].value === 'design-candidates', ins.map(function (i) { return i.value; }).join('|'));
    /* 링크 붙여넣기 → 주소 칸만 + 붙여넣으라는 문구, 읽어 내면 그때 칸이 나타난다 */
    modeBtns[1].click();
    t('링크 모드 = 주소 칸만·안내 문구', q('.ys-gh-url', form).style.display !== 'none'
      && q('.ys-gh-fields', form).style.display === 'none'
      && /붙여넣어 주세요/.test(q('.ys-gh-urlnote', form).textContent));
    ins[0].value = 'https://github.com/paste-org/paste-repo/tree/dev/site';
    ins[0].dispatchEvent(new Event('input'));
    t('주소 읽으면 칸 등장·자동 채움', q('.ys-gh-fields', form).style.display !== 'none'
      && ins[1].value === 'paste-org' && ins[2].value === 'paste-repo'
      && ins[3].value === 'dev' && ins[4].value === 'site',
      [ins[1].value, ins[2].value, ins[3].value, ins[4].value].join('|'));
    t('읽은 결과 문구', /paste-org\/paste-repo/.test(q('.ys-gh-urlnote', form).textContent));
    ins[0].value = 'git@github.com:ssh-org/ssh-repo.git';
    ins[0].dispatchEvent(new Event('input'));
    t('SSH 주소도 인식', ins[1].value === 'ssh-org' && ins[2].value === 'ssh-repo');
    /* 쓰기 토큰 — 「직접 입력하기 | 만드는 법」 두 갈래 */
    var tokTabs = qa('.ys-tokt', form);
    t('토큰 칸 두 갈래 버튼', tokTabs.length === 2 && tokTabs[0].textContent === '직접 입력하기' && tokTabs[1].textContent === '만드는 법');
    tokTabs[1].click();
    var howBox = q('.ys-gh-how', form);
    var howGo = q('.ys-gh-howgo', form);
    t('만드는 법 = 단계 안내 + 바로가기', howBox && howBox.style.display !== 'none'
      && ins[5].style.display === 'none'
      && /Fine-grained tokens/.test(howBox.textContent)
      && /personal-access-tokens\/new/.test(howGo ? howGo.getAttribute('href') : ''));
    tokTabs[0].click();
    t('직접 입력하기로 복귀', ins[5].style.display !== 'none' && howBox.style.display === 'none');
    /* 직접 값을 넣고 변경 실행 */
    modeBtns[0].click();
    ins[1].value = 'yonsei-me-dept'; ins[2].value = 'me-homepage'; ins[3].value = 'main';
    ins[4].value = ''; ins[5].value = 'ghp_TESTTESTTESTTESTTEST0001';
    qa('.ys-act.is-pri', form).filter(function (b) { return b.textContent === '검증하고 변경'; })[0].click();
    await sleep(200);
    var cfm = q('.ys-modal');
    t('변경 전 확인 모달', cfm && cfm.textContent.indexOf('yonsei-me-dept/me-homepage') >= 0);
    qa('.ys-modal-f .is-pri', cfm)[0].click();
    await sleep(450);
    t('ghadd(use:true) 호출', window.__ghadd && window.__ghadd.owner === 'yonsei-me-dept'
      && window.__ghadd.repo === 'me-homepage' && window.__ghadd.use === true
      && window.__ghadd.token === 'ghp_TESTTESTTESTTESTTEST0001');
    t('새 기준점 반영', window.__setHead === 'c0ffee1c0ffee1c0ffee1c0ffee1c0ffee1c0ff', String(window.__setHead).slice(0, 7));
    var gh2 = q('[data-ys-panel="github"]');
    t('카드가 새 저장소·직접 설정 표시', gh2.textContent.indexOf('yonsei-me-dept/me-homepage') >= 0
      && gh2.textContent.indexOf('관리 화면에서 고른 연결') >= 0);
    var chBtn2 = qa('.ys-gh-act .ys-act', gh2).filter(function (b) { return b.textContent.indexOf('깃헙 연결 변경') >= 0; })[0];
    chBtn2.click();
    var form2 = q('.ys-gh-form', gh2);
    var resetBtn = qa('.ys-act', form2).filter(function (b) { return b.textContent.indexOf('기본(환경변수)') >= 0; })[0];
    t('되돌리기 버튼(직접 설정일 때만)', !!resetBtn);
    resetBtn.click();
    await sleep(200);
    var cfm2 = q('.ys-modal');
    t('되돌리기 확인 모달', cfm2 && cfm2.textContent.indexOf('기본 저장소로 되돌립니다') >= 0);
    qa('.ys-modal-f .is-pri', cfm2)[0].click();
    await sleep(450);
    t('ghreset 호출·env 복귀', window.__ghreset === true
      && q('[data-ys-panel="github"]').textContent.indexOf('todo0157/') >= 0);

    /* 11. 편집 종료 버튼 — 확인 모달까지(실행하면 하니스가 리로드되므로 취소) */
    var exitBtn = qa('.ys-stack .ys-btn').filter(function (b) { return b.textContent.indexOf('종료') >= 0; })[0];
    t('스택에 종료 버튼', !!exitBtn);
    exitBtn.click();
    await sleep(200);
    var exCfm = q('.ys-modal');
    t('종료 확인 모달', exCfm && exCfm.textContent.indexOf('편집을 종료') >= 0);
    var exCancel = exCfm && qa('.ys-modal-f button', exCfm).filter(function (b) { return !b.classList.contains('is-pri'); })[0];
    if (exCancel) exCancel.click();
    await sleep(150);

    /* 12. 우측 하단 상태바 — 이름 + 게시 여부만 */
    var stBar = q('.ys-status');
    t('상태바 = 이름·게시 여부', stBar && stBar.textContent.indexOf('테스트') >= 0 && /게시할/.test(stBar.textContent),
      stBar && stBar.textContent);
    t('상태바에 파일명·모드 없음', stBar && stBar.textContent.indexOf('.html') < 0 && stBar.textContent.indexOf('모드') < 0);

    /* 13. 상단 편집 메뉴 — 편집 켜면 한글 페이지 이름·한/영 */
    Y.hud.setStatus({ page: 'G-news.html' });
    Y.hud.setEditing(true);
    await sleep(150);
    var tm = q('.ys-topmenu');
    var rootEl2 = q('.ys-root');
    t('편집 켜면 상단 메뉴(소식·한/영)', rootEl2.classList.contains('is-editing')
      && tm.textContent.indexOf('소식') >= 0 && tm.textContent.indexOf('한/영') >= 0, tm.textContent);
    Y.hud.setStatus({ page: 'H-academic.html' });
    t('페이지 한글 이름 매핑(메인)', q('.ys-tm-i').textContent === '메인', q('.ys-tm-i').textContent);
    var offB = qa('.ys-tm-b', tm).filter(function (b) { return b.textContent.indexOf('편집 끝내기') >= 0; })[0];
    t('편집 끝내기 버튼 있음', !!offB);
    offB.click();
    await sleep(120);
    t('끝내기 → 편집 모드 해제', !rootEl2.classList.contains('is-editing'));

    /* 14. 정렬 회귀 — is-on 이 형제 사이를 옮겨 다녀도 짝이 밀리면 안 된다.
          (홈 연구분야에서 짝이 한 칸 밀린 채 삭제가 게시돼 원문이 지워진 사고의 재현) */
    var pSrc = '<!doctype html><html><head><meta charset="utf-8"></head><body><div class="g">'
      + '<div class="fx-t is-on" data-i="0"><p>역학</p></div>'
      + '<div class="fx-t" data-i="1"><p>열유체</p></div>'
      + '<div class="fx-t" data-i="2"><p>동역학</p></div>'
      + '</div></body></html>';
    var pDoc = new DOMParser().parseFromString(pSrc, 'text/html');
    var pz = Y.source.zip(pDoc, Y.source.scan(pSrc));
    t('정렬 하니스 zip 성공', pz.ok, pz.reason);
    var lDoc = new DOMParser().parseFromString(pSrc, 'text/html');
    qa('.fx-t', lDoc).forEach(function (el) {
      el.classList.toggle('is-on', el.getAttribute('data-i') === '2');
    });
    var amap = Y.align(pz.nodes, lDoc.documentElement);
    var alignOk = true, alignGot = [];
    qa('.fx-t', lDoc).forEach(function (el) {
      var ai = amap.indexOf(el);
      var srcEl = ai == null ? null : pz.nodes[ai];
      var srcI = srcEl ? srcEl.getAttribute('data-i') : 'X';
      alignGot.push(el.getAttribute('data-i') + '→' + srcI);
      if (srcI !== el.getAttribute('data-i')) alignOk = false;
    });
    t('is-on 이동해도 정렬 안 밀림', alignOk, alignGot.join(' '));

    var fail = results.filter(function (r) { return !r.ok; }).length;
    var sum = 'TOTAL ' + results.length + ' · FAIL ' + fail;
    console.log(sum);
    var h = document.createElement('h2');
    h.textContent = sum;
    logEl.appendChild(h);
    return sum;
  })();
})();
</script>
</body>
</html>

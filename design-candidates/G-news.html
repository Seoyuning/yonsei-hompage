<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[시안 G · 관제] 소식 — 연세대학교 기계공학부</title>
<meta name="description" content="연세대학교 기계공학부의 학부·대학원 공지사항과 연구 뉴스, 세미나·행사 안내를 확인할 수 있습니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
<style>
/* 소식 — 흰 배경 · 네이비 제목 · 실제 학과식 풀폭 게시판(표) 목록.
   히어로: 이미지 배너 + 중앙 정렬 타이틀 + 브레드크럼.
   섹션: 학부 공지(#notice-ug) · 대학원 공지(#notice-grad) · 뉴스(#hi) · 세미나·행사(#sched). */
:root{
  --navy:#1a3d75;
  --coral:#1a3d75;
  --ink:#22304b;
  --body:#4a5a74;
  --sub:#5c6b85;
  --muted:#7b8595;
  --label:#9aa3b0;
  --dimmer:#7b8595;
  --line:rgba(10,26,51,.14);
  --line-soft:rgba(10,26,51,.08);
  --row:#f5f8fc;
  --mono:"Apple SD Gothic Neo","Noto Sans KR","Pretendard Variable","Pretendard",system-ui,sans-serif;
  --kr:"Apple SD Gothic Neo","Noto Sans KR","Pretendard Variable","Pretendard",system-ui,sans-serif;
  /* 분류 배지 색 */
  --cat-acad:#2b4a7a;
  --cat-sch:#b0742c;
  --cat-recruit:#4a7c59;
  --cat-etc:#6b7688;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--kr);
  background:#ffffff; color:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden; word-break:keep-all;
  line-height:1.6;
}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.skip{position:absolute;left:.6rem;top:-3rem;z-index:60;background:var(--navy);color:#fff;
  padding:.55rem 1rem;font-size:.8rem;transition:top .15s}
.skip:focus{top:.6rem}

/* ── 페이지 히어로 (이미지 배너 + 중앙 정렬) ── */
.phero{position:relative;min-height:clamp(14rem,30vh,20rem);display:flex;align-items:center;justify-content:center;text-align:center;background:#12294f url("assets/hero-news.jpg") center 42%/cover no-repeat;color:#fff;overflow:hidden}
/* 사진은 배경 질감으로 — 흑백 + 네이비 모노톤. 스톡 사진은 잘 보이게 할수록
   "다국적 학생들이 웃는 강의실" 전형이 드러나 티가 난다. 인물이 주인공이 되지 않게 눌러
   질감으로만 남긴다. filter 를 요소에 걸면 글자까지 흐려지므로 사진 층(::before)에만 건다.
   background:inherit 로 각 페이지가 지정한 이미지·위치를 그대로 물려받는다. */
.phero::before{content:"";position:absolute;inset:0;background:inherit;
  filter:grayscale(1) contrast(1.2) brightness(.6)}
/* 네이비 이중 그라디언트 — 가운데는 글자가 읽히게, 가장자리로 갈수록 짙어져
   히어로가 다음 섹션의 흰 배경으로 자연스럽게 떨어진다. */
.phero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(125% 95% at 50% 58%,rgba(10,22,44,.50) 0%,rgba(10,22,44,.70) 52%,rgba(8,17,34,.90) 100%),
  linear-gradient(180deg,rgba(18,41,79,.62) 0%,rgba(16,35,68,.50) 40%,rgba(10,22,44,.78) 100%)}
.phero-in{position:relative;z-index:1;padding:clamp(9.5rem,7rem + 4vw,11.5rem) 1.2rem clamp(2.6rem,5vh,4rem);max-width:60rem}
.phero h1{font-size:clamp(1.9rem,1.2rem + 2.6vw,3rem);font-weight:800;letter-spacing:-.01em;line-height:1.16;color:#fff}
.phero-kick{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:.6rem}
.phero .bc{margin:0 0 1.05rem;font-size:.82rem;letter-spacing:.02em;color:rgba(255,255,255,.82)}

/* ── 섹션 공통 — 풀폭(끝까지) ── */
.sec{max-width:1600px;margin:0 auto;
  padding:clamp(2.6rem,1.8rem + 2.5vw,3.8rem) clamp(1rem,.4rem + 1.6vw,2.4rem);
  border-bottom:1px solid var(--line-soft)}
.sec:last-of-type{border-bottom:0}
.sec-head{margin-bottom:clamp(1.3rem,.9rem + 1.3vw,2rem)}
.sec-kick{font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--coral);margin-bottom:.5rem}
.sec-title{font-weight:800;color:var(--navy);
  font-size:clamp(1.5rem,1rem + 2vw,2.1rem);line-height:1.2;letter-spacing:-.01em}
.sec-sub{font-size:.94rem;color:var(--sub);line-height:1.7;max-width:52rem;margin-top:.6rem}
.sec-more{font-size:.84rem;color:var(--muted);white-space:nowrap;transition:color .15s}
.sec-more:hover{color:var(--coral)}

/* ── 게시판 툴바(분류 필터 + 검색) — 읽기 쉽게 넉넉히 ── */
.board-tool{display:flex;align-items:center;justify-content:space-between;gap:1.2rem 1.6rem;
  flex-wrap:wrap;padding-bottom:1.1rem;margin-bottom:0}
.board-cats{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.bcat{display:inline-flex;align-items:baseline;gap:.4rem;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
  font-family:var(--kr);font-weight:600;font-size:.9rem;line-height:1.4;
  padding:.5rem 1.05rem;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.bcat:hover{color:var(--navy);border-color:#aebccf}
.bcat .cnt{font-size:.86em;font-weight:500;color:var(--label);font-variant-numeric:tabular-nums}
.bcat[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.bcat[aria-pressed="true"] .cnt{color:rgba(255,255,255,.78)}
.board-search{display:flex;align-items:stretch;gap:0;min-width:min(24rem,100%)}
.board-search .field{display:flex;align-items:center;gap:.6rem;flex:1;
  border:1px solid var(--line);border-right:0;background:#fff;padding:.6rem .95rem}
.board-search .field:focus-within{border-color:var(--navy)}
.board-search svg{flex:none;color:var(--label)}
.board-search input{flex:1;background:none;border:0;outline:none;color:var(--ink);
  font-family:var(--kr);font-size:.95rem;line-height:1.4;padding:0;min-width:0}
.board-search input::placeholder{color:var(--label)}
.board-search button{flex:none;border:0;background:var(--navy);color:#fff;cursor:pointer;
  font-family:var(--kr);font-size:.92rem;font-weight:700;padding:0 1.3rem;transition:background .15s}
.board-search button:hover{background:#12305f}
.board-status{font-family:var(--mono);font-size:.82rem;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.board-status b{color:var(--coral);font-weight:700}
.board-meta{display:flex;align-items:center;justify-content:flex-end;padding:.2rem .1rem .9rem}

/* ── 공지 표(게시판) ── */
.ntable{width:100%;border-collapse:collapse;border-top:2px solid var(--navy);table-layout:fixed}
.ntable thead th{font-size:.84rem;font-weight:700;color:var(--sub);text-align:center;
  padding:.95rem .8rem;border-bottom:1px solid var(--line);background:#fafbfd}
.ntable thead th.h-title{text-align:left}
.ntable td{font-size:.95rem;color:var(--ink);padding:1rem .8rem;border-bottom:1px solid var(--line-soft);
  vertical-align:middle;text-align:center}
.ntable tbody tr{transition:background .12s}
.ntable tbody tr:hover{background:var(--row)}
.ntable tr.pinned{background:#f3f6fb}
.ntable tr.pinned:hover{background:#eef2f9}
.c-no{width:6rem;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.86rem}
.c-cat{width:8.5rem}
.ntable td.c-title{text-align:left}
.c-title a{display:inline-block;color:var(--ink);line-height:1.5;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;vertical-align:middle}
.c-title a:hover{color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.c-writer{width:9rem;color:var(--muted);font-size:.86rem}
.c-date{width:8rem;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.86rem;letter-spacing:.02em}
.cbadge{display:inline-block;font-size:.76rem;font-weight:600;line-height:1.3;
  padding:.22rem .6rem;border-radius:999px;color:#fff;letter-spacing:-.01em}
.cat-acad{background:var(--cat-acad)}
.cat-sch{background:var(--cat-sch)}
.cat-recruit{background:var(--cat-recruit)}
.cat-etc{background:var(--cat-etc)}
.pin{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;background:var(--coral);
  padding:.2rem .55rem;border-radius:3px;white-space:nowrap}
.nempty{padding:3rem .9rem;text-align:center;font-size:.94rem;color:var(--muted);
  border-bottom:1px solid var(--line-soft)}

/* ── 뉴스 · 연구 성과 (비대칭: 대표 1 + 목록) ── */
.news-lead{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(1.4rem,1rem + 2vw,2.6rem);
  align-items:stretch;margin-bottom:2rem}
.news-hero{position:relative;display:block;overflow:hidden;background:#e8edf4;min-height:15rem}
.news-hero img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;transition:transform .5s ease}
.news-hero:hover img{transform:scale(1.04)}
.news-hero .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:2.4rem 1.5rem 1.3rem;color:#fff;
  background:linear-gradient(180deg,rgba(10,19,38,0),rgba(9,17,34,.86))}
.news-hero .cap .tag{display:inline-block;font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.82);margin-bottom:.5rem}
.news-hero .cap h3{font-size:1.22rem;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.news-hero .cap .date{font-family:var(--mono);font-size:.76rem;color:rgba(255,255,255,.75);margin-top:.55rem}
.news-side{display:flex;flex-direction:column;justify-content:center}
.news-side .side-h{font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.02em;
  padding-bottom:.7rem;border-bottom:2px solid var(--navy);margin-bottom:.2rem}
.nlist{border-top:0}
.nlink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.2rem;align-items:baseline;
  padding:.95rem .3rem;border-bottom:1px solid var(--line-soft);transition:background .12s}
.nlink:hover{background:var(--row)}
.nlink .t{font-size:.95rem;color:var(--ink);line-height:1.5;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlink:hover .t{color:var(--navy)}
.nlink .d{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── 세미나 · 행사 2단 ── */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,1rem + 3vw,3.5rem);align-items:start}
.duo h3{font-size:1.06rem;font-weight:700;color:var(--navy);margin-bottom:.4rem;
  padding-bottom:.7rem;border-bottom:2px solid var(--navy)}
.duo h3 .cnt{font-size:.8rem;font-weight:500;color:var(--muted);margin-left:.45rem;font-variant-numeric:tabular-nums}

/* ── 반응형 ── */
@media (max-width:860px){
  .news-lead{grid-template-columns:1fr}
  .duo{grid-template-columns:1fr}
}
@media (max-width:720px){
  .ntable{table-layout:auto}
  .ntable .c-writer,.ntable .h-writer{display:none}
  .ntable .c-no,.ntable .h-no{display:none}
  .board-search{width:100%}
}
</style>
<style>.ynav-ph{position:fixed;top:0;left:0;right:0;height:3.7rem;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(0,0,0,.08);z-index:39}</style>
<style>h1,h2,.sec-title,.phero h1{font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em}</style>
</head>

<script>
(function(){
  'use strict';
  var D = window.YSME;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* 제목 키워드 기반 분류(위에서부터 우선, 무매칭 → 행사·기타) */
  var CAT_RULES = [
    { id:'acad',    re:/수강|철회|재수강|성적|졸업|학적|휴학|복학|학사|학위|논문|재입학|전형|전공|교과목/ },
    { id:'sch',     re:/장학/ },
    { id:'recruit', re:/모집|채용|선발|인턴|공모/ }
  ];
  var CATS = [
    { id:'all', label:'전체' }, { id:'acad', label:'수강·학사' },
    { id:'sch', label:'장학' }, { id:'recruit', label:'모집·채용' }, { id:'etc', label:'행사·기타' }
  ];
  var CATLABEL = { acad:'수강·학사', sch:'장학', recruit:'모집·채용', etc:'행사·기타' };
  function classify(title){
    for(var i=0;i<CAT_RULES.length;i++){ if(CAT_RULES[i].re.test(title)) return CAT_RULES[i].id; }
    return 'etc';
  }

  /* ── 재사용 게시판(표) 빌더 — 학부/대학원 각각 ── */
  function buildBoard(scope, list){
    var root = document.querySelector('.board[data-scope="'+scope+'"]');
    var tbody = root.querySelector('tbody');
    var catWrap = root.querySelector('.board-cats');
    var input = root.querySelector('.board-search input');
    var statusEl = root.querySelector('.board-status');
    var emptyEl = root.querySelector('.nempty');
    var table = root.querySelector('.ntable');
    var cat = 'all', q = '';

    var counts = { all:list.length, acad:0, sch:0, recruit:0, etc:0 };
    list.forEach(function(x){ counts[classify(x.title)]++; });
    catWrap.innerHTML = CATS.map(function(c){
      return '<button type="button" class="bcat" data-cat="'+c.id+'" aria-pressed="'+(cat===c.id)+'">'
        + esc(c.label)+' <span class="cnt">'+counts[c.id]+'</span></button>';
    }).join('');

    function rowHtml(x){
      var pinned = (x.no === '공지');
      var cid = classify(x.title);
      return '<tr class="'+(pinned?'pinned':'')+'">'
        + '<td class="c-no">'+(pinned?'<span class="pin">공지</span>':esc(x.no))+'</td>'
        + '<td class="c-cat"><span class="cbadge cat-'+cid+'">'+esc(CATLABEL[cid])+'</span></td>'
        + '<td class="c-title"><a href="'+esc(x.url)+'" target="_blank" rel="noopener" title="'+esc(x.title)+'">'+esc(x.title)+'</a></td>'
        + '<td class="c-writer">기계공학부</td>'
        + '<td class="c-date">'+esc(x.date)+'</td>'
        + '</tr>';
    }
    function render(){
      var ql = q.trim().toLowerCase();
      var hits = list.filter(function(x){
        if(cat!=='all' && classify(x.title)!==cat) return false;
        if(ql && String(x.title).toLowerCase().indexOf(ql)<0) return false;
        return true;
      });
      tbody.innerHTML = hits.map(rowHtml).join('');
      table.style.display = hits.length ? '' : 'none';
      emptyEl.hidden = hits.length>0;
      statusEl.innerHTML = (hits.length === list.length)
        ? '전체 '+list.length+'건'
        : '전체 '+list.length+'건 중 <b>'+hits.length+'</b>건';
      catWrap.querySelectorAll('.bcat').forEach(function(b){
        b.setAttribute('aria-pressed', String(b.dataset.cat===cat));
      });
    }
    catWrap.addEventListener('click', function(e){
      var b = e.target.closest('.bcat'); if(!b || b.dataset.cat===cat) return;
      cat = b.dataset.cat; render();
    });
    input.addEventListener('input', function(){ q = input.value; render(); });
    render();
  }
  buildBoard('ug', D.noticesUG);
  buildBoard('grad', D.noticesGrad);

  /* ── 뉴스 · 연구 성과 (대표 1 + 사이드 목록 + 하단 목록) ── */
  (function(){
    var news = D.newsList.slice();
    if(!news.length) return;
    var lead = news[0], side = news.slice(1,5), rest = news.slice(5);
    var leadEl = document.getElementById('newsLead');
    leadEl.innerHTML =
      '<a class="news-hero" href="'+esc(lead.url)+'" target="_blank" rel="noopener">'
        + (lead.thumb ? '<img src="'+esc(lead.thumb)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '')
        + '<span class="cap"><span class="tag">Featured</span>'
        + '<h3>'+esc(lead.title)+'</h3><span class="date">'+esc(lead.date)+'</span></span>'
      + '</a>'
      + '<div class="news-side"><div class="side-h">최근 소식</div>'
        + side.map(function(n){
            return '<a class="nlink" href="'+esc(n.url)+'" target="_blank" rel="noopener">'
              + '<span class="t">'+esc(n.title)+'</span><span class="d">'+esc(n.date)+'</span></a>';
          }).join('')
      + '</div>';
    document.getElementById('newsRows').innerHTML = rest.map(function(n){
      return '<a class="nlink" href="'+esc(n.url)+'" target="_blank" rel="noopener">'
        + '<span class="t">'+esc(n.title)+'</span><span class="d">'+esc(n.date)+'</span></a>';
    }).join('');
  })();

  /* ── 세미나 · 행사 ── */
  function linkRow(x){
    return '<a class="nlink" href="'+esc(x.url)+'" target="_blank" rel="noopener">'
      + '<span class="t">'+esc(x.title)+'</span><span class="d">'+esc(x.date)+'</span></a>';
  }
  document.getElementById('semRows').innerHTML = D.seminars.map(linkRow).join('');
  document.getElementById('evtRows').innerHTML = D.events.map(linkRow).join('');
  document.getElementById('semCount').textContent = D.seminars.length+'건';
  document.getElementById('evtCount').textContent = D.events.length+'건';
})();

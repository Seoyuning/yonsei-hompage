<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[시안 G · 관제] 연구 — 연세대학교 기계공학부</title>
<meta name="description" content="연세대학교 기계공학부 연구. 6개 연구 분야와 33개 연구실 — 분야별 분포와 연구실·담당 교수·위치·홈페이지 안내." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
/* ═══════════════════════════════════════════════════════════
   연구 — 연세대학교 기계공학부 (기관형 · 아이보리)
   이미지 배너 히어로(중앙 정렬 + 브레드크럼) · 아이보리 본문 ·
   제목/액센트 단일 네이비 #1a3d75 · 카드 #f7f9fc ·
   헤어라인 rgba(10,26,51,.08~.14).
   콘텐츠: 6개 분야 요약(스탯 6칸) + 33개 연구실 목록
   (담당 교수 · 위치 · 홈페이지/영상 링크).
   데이터: 공유 단일 소스 window.YSME(data.js).
   ═══════════════════════════════════════════════════════════ */
:root{
  --navy:#1a3d75;
  --coral:#1a3d75;--warm:#1a3d75;
  --ink:#1a3d75;
  --body:#4a5a74;
  --sub:#5c6b85;
  --muted:#7b8595;
  --label:#9aa3b0;
  --line:rgba(10,26,51,.12);
  --line-soft:rgba(10,26,51,.08);
  --card:#f7f9fc;
  --card-hover:#eef3fa;
  --mono:"Pretendard Variable","Pretendard",system-ui,sans-serif;
  --kr:"Pretendard Variable","Pretendard",system-ui,sans-serif;
  /* 6개 연구 분야 액센트 — 단일 네이비로 통일 (레인보우 제거) */
  --c-solid:#1a3d75;
  --c-thermal:#1a3d75;
  --c-manuf:#1a3d75;
  --c-nanobio:#1a3d75;
  --c-optics:#1a3d75;
  --c-dyn:#1a3d75;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--mono);
  background:#f5f2ec; color:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden; word-break:keep-all;
  line-height:1.5;
}
:lang(ko),.kr{font-family:var(--kr)}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.dim{color:var(--label)}
.tnum{font-variant-numeric:tabular-nums}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.skip{position:absolute;left:.6rem;top:-3rem;z-index:60;background:var(--coral);color:#fff;
  font-family:var(--kr);font-size:.8rem;padding:.5rem .9rem;transition:top .15s}
.skip:focus{top:.6rem}

/* ── 페이지 히어로 (이미지 배너 · 중앙 정렬 + 브레드크럼) ── */
.phero{position:relative;min-height:clamp(14rem,30vh,20rem);display:flex;align-items:center;justify-content:center;text-align:center;background:#12294f url("assets/hero-research.jpg") center 42%/cover no-repeat;color:#fff;overflow:hidden}
.phero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,19,38,.62),rgba(13,29,56,.82))}
.phero-in{position:relative;z-index:1;padding:clamp(9.5rem,7rem + 4vw,11.5rem) 1.2rem clamp(2.6rem,5vh,4rem);max-width:60rem}
.phero h1{font-size:clamp(1.9rem,1.2rem + 2.6vw,3rem);font-weight:800;letter-spacing:-.01em;line-height:1.16;color:#fff}
.phero .bc{margin-top:.9rem;font-size:.82rem;letter-spacing:.02em;color:rgba(255,255,255,.82)}

/* ── 섹션 헤더 공통 ── */
/* 표준 헤더 — [킥커 ↔ 사이드 링크(baseline)] 아래 제목·부제, 왼쪽 div 세로 스택 (G-console 계승) */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;
  gap:1.5rem;flex-wrap:wrap;margin-bottom:clamp(1.6rem,1rem + 2vw,2.4rem)}
.sec-kick{font-family:var(--mono);font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--coral)}
.sec-title{font-family:var(--kr);font-weight:700;color:var(--ink);
  font-size:clamp(1.5rem,1rem + 2vw,2.1rem);line-height:1.24;letter-spacing:-.01em;margin-top:.5rem}
.sec-sub{font-family:var(--kr);font-size:.92rem;color:var(--sub);margin-top:.7rem;max-width:52rem;line-height:1.7}

/* ── 요약: 6개 분야 · 33개 연구실 (단정한 스탯 행) ── */
.summary{max-width:1120px;margin:0 auto;
  padding:clamp(2.8rem,2rem + 3vw,4.2rem) clamp(1.2rem,.6rem + 2vw,2.6rem);
  border-bottom:1px solid var(--line-soft)}
.sum-head{font-family:var(--kr);font-size:1rem;color:var(--sub);line-height:1.7;margin-bottom:1.8rem;max-width:52rem}
.sum-head b{color:var(--ink);font-weight:700}

/* 분야별 연구실 수 — 6칸 스탯 (단일 네이비 액센트) */
.stat-row{display:grid;grid-template-columns:repeat(6,1fr);
  border-top:1px solid var(--line);border-left:1px solid var(--line-soft)}
.stat-item{padding:1.2rem 1rem;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  transition:background .12s}
.stat-item:hover{background:var(--card)}
.stat-item .num{font-family:var(--kr);font-weight:700;font-size:clamp(1.6rem,1.1rem + 1.6vw,2.1rem);
  line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.stat-item .num .u{font-size:.42em;font-weight:600;color:var(--muted);margin-left:.12em}
.stat-item .ko{font-family:var(--kr);font-size:.82rem;color:var(--sub);margin-top:.55rem;line-height:1.4}
@media (max-width:760px){.stat-row{grid-template-columns:repeat(2,1fr)}}
@media (max-width:400px){.stat-row{grid-template-columns:1fr}}

/* ── 분야별 연구실 (카드 블록 × 6) ── */
.clusters{max-width:1120px;margin:0 auto;
  padding:clamp(2.8rem,2rem + 3vw,4.2rem) clamp(1.2rem,.6rem + 2vw,2.6rem) 1.6rem}
.cluster{border:1px solid var(--line-soft);border-left:3px solid var(--cl-c,var(--coral));
  background:var(--card);margin-bottom:1.4rem;scroll-margin-top:6.6rem}

.cl-head{display:grid;grid-template-columns:auto 1fr auto;gap:1rem 1.2rem;align-items:start;
  padding:1.25rem clamp(1rem,.6rem + 1.4vw,1.6rem) 1.1rem;border-bottom:1px solid var(--line)}
.cl-code{display:flex;align-items:center;padding-top:.4rem}
.cl-code .cdot{width:9px;height:9px;border-radius:50%;background:var(--cl-c,var(--coral));flex:none}
.cl-titles{min-width:0}
.cl-titles .ko{font-family:var(--kr);font-weight:700;font-size:clamp(1.15rem,.9rem + 1vw,1.45rem);
  color:var(--ink);line-height:1.25;letter-spacing:-.01em}
.cl-titles .desc{font-family:var(--kr);font-size:.88rem;color:var(--sub);line-height:1.65;margin-top:.55rem;max-width:44rem}
.cl-metric{text-align:right;white-space:nowrap;padding-top:.15rem}
.cl-metric .num{font-family:var(--mono);font-weight:300;font-size:clamp(1.8rem,1.2rem + 2vw,2.4rem);
  line-height:.9;color:var(--ink);font-variant-numeric:tabular-nums}
.cl-metric .num .u{color:var(--cl-c,var(--coral));font-family:var(--kr);font-size:.42em;margin-left:.1em}
.cl-metric .share{font-family:var(--kr);font-size:.72rem;color:var(--label);margin-top:.45rem}

/* 연구실 행 목록 */
.lab-legend{display:grid;
  grid-template-columns:minmax(9rem,1.05fr) minmax(9rem,1.35fr) minmax(6.5rem,.7fr) 7.5rem;
  gap:1rem;align-items:center;
  padding:.55rem clamp(1rem,.6rem + 1.4vw,1.6rem);border-bottom:1px solid var(--line);
  font-family:var(--kr);font-size:.7rem;color:var(--label)}
.lab-legend .rt{text-align:right}
.lab-row{display:grid;
  grid-template-columns:minmax(9rem,1.05fr) minmax(9rem,1.35fr) minmax(6.5rem,.7fr) 7.5rem;
  gap:1rem;align-items:center;
  padding:.85rem clamp(1rem,.6rem + 1.4vw,1.6rem);border-bottom:1px solid var(--line-soft);
  transition:background .12s}
.lab-row:last-child{border-bottom:0}
.lab-row:hover{background:var(--card-hover)}
.l-name{min-width:0}
.l-name .ko{font-family:var(--kr);font-weight:600;font-size:.96rem;color:var(--ink);line-height:1.3}
.l-name .en{font-family:var(--kr);font-size:.74rem;color:var(--muted);margin-top:.22rem;line-height:1.5;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.l-pi{min-width:0;font-size:.82rem;color:var(--body)}
.l-pi .pi{font-family:var(--kr);color:#2a3a56;display:inline-flex;align-items:center;gap:.45rem}
.l-pi .pi .cdot{width:6px;height:6px;border-radius:50%;background:var(--cl-c,var(--coral));flex:none}
.l-pi a.pi{transition:color .15s}
.l-pi a.pi:hover{color:var(--coral);text-decoration:underline;text-underline-offset:3px}
.l-pi .role{font-family:var(--kr);font-size:.72rem;color:var(--label);margin-top:.2rem}
.l-loc{min-width:0;font-family:var(--kr);font-size:.78rem;color:var(--sub);
  display:inline-flex;align-items:center;gap:.4rem}
.l-loc svg{flex:none;color:var(--label)}
.l-act{text-align:right;font-family:var(--kr);font-size:.76rem;white-space:nowrap;line-height:1.8}
.l-act a{color:var(--muted);transition:color .15s}
.l-act a:hover{color:var(--cl-c,var(--coral))}
.l-act a.ext{color:var(--coral)}
.lab-note{font-family:var(--kr);font-size:.8rem;color:var(--muted);margin-top:.4rem;line-height:1.6}

/* ── 학부연구생(인턴) 모집 — 코랄 배지 + 접이식 상세 ── */
.intern-sum{font-family:var(--kr);font-size:.88rem;color:var(--sub);margin-top:.85rem;line-height:1.65}
.intern-sum b{color:var(--coral);font-weight:700}
.i-badge{display:inline-block;font-family:var(--kr);font-size:.64rem;font-weight:600;letter-spacing:.02em;
  color:var(--coral);border:1px solid var(--coral);padding:.14rem .45rem;margin-left:.55rem;
  vertical-align:2px;white-space:nowrap}
summary .i-badge::after{content:"▾";margin-left:.35rem;font-size:.85em}
.lab-item[open] summary .i-badge::after{content:"▴"}
.lab-item{border-bottom:1px solid var(--line-soft)}
.lab-list>:last-child{border-bottom:0}
.lab-item>summary.lab-row{border-bottom:0;cursor:pointer;list-style:none}
.lab-item>summary.lab-row::-webkit-details-marker{display:none}
.lab-item>summary.lab-row::marker{content:""}
.lab-item[open]>summary.lab-row{background:var(--card-hover)}
.lab-row,.lab-item{scroll-margin-top:6.6rem}
.intern-panel{border-top:1px dashed var(--line);background:rgba(26, 61, 117,.04);
  padding:1.05rem clamp(1rem,.6rem + 1.4vw,1.6rem) 1.25rem}
.intern-panel .ip-head{font-family:var(--kr);font-size:.7rem;font-weight:700;letter-spacing:.08em;
  color:var(--coral);margin-bottom:.65rem}
.ip-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.5rem 1.2rem;
  font-family:var(--kr);font-size:.85rem;color:var(--body);line-height:1.7}
.ip-grid dt{font-size:.74rem;font-weight:600;color:var(--label);white-space:nowrap;padding-top:.15rem}
.ip-grid dd{min-width:0}
.ip-grid ul{margin:0;padding-left:1.1rem}
.ip-grid li{margin:.18rem 0}
@media (max-width:860px){
  .ip-grid{grid-template-columns:1fr;gap:.2rem}
  .ip-grid dd{margin-bottom:.55rem}
}

/* ── 대학원 진학 CTA — 네이비 밴드 (메인 계승) ── */
.cta{background:var(--navy);color:#fff;
  padding:clamp(2.6rem,1.6rem + 3.5vw,4.2rem) clamp(1.4rem,.6rem + 2vw,3rem);
  display:flex;justify-content:space-between;align-items:center;gap:2rem;flex-wrap:wrap;
  max-width:1120px;margin:clamp(3rem,2rem + 3vw,4.5rem) auto;
  margin-inline:clamp(1.2rem,.6rem + 2vw,2.6rem)}
@media(min-width:1180px){.cta{margin-inline:auto}}
.cta .cta-txt{max-width:34rem}
.cta .cta-kick{font-family:var(--mono);font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:#9db4d8}
.cta h2{font-family:var(--kr);font-weight:700;color:#fff;
  font-size:clamp(1.4rem,1rem + 2vw,2.1rem);line-height:1.25;letter-spacing:-.01em;margin-top:.6rem}
.cta p{font-family:var(--kr);color:#c6d2e4;margin-top:.8rem;line-height:1.6;font-size:.98rem}
.cta .cta-btn{font-family:var(--kr);font-weight:600;font-size:1rem;
  background:#fff;color:var(--navy);padding:.9rem 1.6rem;white-space:nowrap;
  border:1px solid #fff;transition:background .15s,color .15s}
.cta .cta-btn:hover{background:transparent;color:#fff;border-color:#fff}
.cta .cta-btn .arr{color:var(--coral)}

/* ── 반응형 ── */
@media (max-width:860px){
  .lab-legend{display:none}
  .cl-head{grid-template-columns:auto 1fr;gap:.7rem 1rem}
  .cl-metric{grid-column:1 / -1;text-align:left;display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;padding-top:.2rem}
  .cl-metric .share{margin-top:0}
  .lab-row{grid-template-columns:2.6rem 1fr;gap:.5rem 1rem;padding:.95rem clamp(.8rem,.5rem + 1vw,1.2rem);align-items:start}
  .l-name{grid-column:2;grid-row:1}
  .l-pi{grid-column:2;grid-row:2;margin-top:.4rem}
  .l-loc{grid-column:2;grid-row:3;margin-top:.35rem}
  .l-act{grid-column:2;grid-row:4;text-align:left;margin-top:.5rem}
}
</style>
<style>.ynav-ph{position:fixed;top:0;left:0;right:0;height:3.7rem;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(0,0,0,.08);z-index:39}</style>
</head>
<body>
<div class="ynav-ph" aria-hidden="true"></div>
<a class="skip" href="#clusters">본문(연구 분야) 바로가기</a>

<!-- 페이지 히어로 -->
<header class="phero">
  <div class="phero-in">
    <h1>연구 분야</h1>
    <p class="bc">홈 › 연구</p>
  </div>
</header>

<main>
  <!-- 요약: 6개 분야 · 33개 연구실 -->
  <section class="summary" aria-label="연구 분야 요약">
    <div class="sum-head">
      기계공학부의 연구는 <b>6개 분야</b> 아래 <b>33개 연구실</b>로 구성됩니다.
    </div>
    <div class="stat-row" id="statRow"></div>
  </section>

  <!-- 분야별 연구실 (블록 × 6) -->
  <section class="clusters" id="clusters" aria-label="연구 분야별 연구실">
    <div class="sec-head">
      <div>
        <p class="sec-kick">연구 분야</p>
        <h2 class="sec-title">분야별 연구실</h2>
        <p class="sec-sub">여섯 분야 아래 33개 연구실입니다. 연구실명을 누르면 홈페이지로 이동합니다.</p>
        <p class="intern-sum" id="internSum" hidden></p>
      </div>
    </div>
    <div id="clusterBlocks"></div>
    <p class="lab-note">분야 구분은 연구실 명칭을 기반으로 한 자체 분류입니다.</p>
  </section>
</main>

<!-- 대학원 진학 CTA -->
<section class="cta" aria-labelledby="cta-h">
  <div class="cta-txt">
    <p class="cta-kick">대학원 진학</p>
    <h2 id="cta-h">관심 있는 연구실을<br>찾으셨나요?</h2>
    <p>대학원 진학 절차와 학부생 연구 참여 방법은 입학 안내에서 확인할 수 있습니다.</p>
  </div>
  <a class="cta-btn" href="G-admissions.html#graduate">대학원 진학 안내 <span class="arr">→</span></a>
</section>

<!-- 공유 단일 데이터 소스 (window.YSME) -->
<script src="assets/js/data.js?v=d11"></script>
<script>
(function(){
  'use strict';

  /* ── 데이터 (공유 단일 소스 window.YSME · data.js) ── */
  var D = window.YSME;
  var clusters = D.clusters;
  var labs = D.labs;
  var professors = D.professors;
  /* 6분야 id → 라이트 팔레트 CSS 토큰 매핑 */
  var CVAR = { solid:'--c-solid', thermal:'--c-thermal', manufacturing:'--c-manuf',
               micro:'--c-nanobio', optics:'--c-optics', dynamics:'--c-dyn' };

  var TOTAL = labs.length; // 33
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* 분야별 연구실 그룹 + 순번 부여 (원본 순서 = 01..33) */
  var byCluster = {};
  clusters.forEach(function(c){ byCluster[c.id] = []; });
  labs.forEach(function(l){ if(byCluster[l.cluster]) byCluster[l.cluster].push(l); });
  /* 표시용 count는 실제 lab.cluster 집계로 재산정(데이터 정합 보장) */
  clusters.forEach(function(c){ c.count = byCluster[c.id].length; });

  /* ── 요약 스탯 행 (분야명 + 연구실 수 · 앵커 링크) ── */
  var statRow = document.getElementById('statRow');
  if(statRow){
    statRow.innerHTML = clusters.map(function(c){
      return '<a class="stat-item" href="#'+esc(c.id)+'">'
        + '<div class="num tnum">'+c.count+'<span class="u">개</span></div>'
        + '<div class="ko">'+esc(c.ko)+'</div>'
        + '</a>';
    }).join('');
  }

  /* ── 분야 블록 × 6 ── */
  function pin(){ return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-5.686 7-11a7 7 0 1 0-14 0c0 5.314 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>'; }

  /* labId → professor (role·보직 라벨 + 교수진 딥링크 조회용) */
  var profByLab = {};
  (professors || []).forEach(function(p){ if(p.labId) profByLab[p.labId] = p; });

  /* 인턴 필드 실값 판정 — placeholder "O명"/빈값 제외 */
  function realVal(v){
    v = String(v==null?'':v).trim();
    return (!v || /^[Oo0]\s*명$/.test(v)) ? '' : v;
  }
  function internInfo(l){
    var t = realVal(l.internTarget), b = realVal(l.internBenefit), a = realVal(l.internArea);
    return (t || b || a) ? { target:t, benefit:b, area:a } : null;
  }

  function labRow(l, c){
    var prof = profByLab[l.id];
    var role = prof && prof.role ? prof.role : '';
    var info = internInfo(l);
    var nameKo = l.site
      ? '<a class="ext" style="color:inherit" href="'+esc(l.site)+'" target="_blank" rel="noopener">'+esc(l.ko)+'</a>'
      : esc(l.ko);
    var badge = info ? '<span class="i-badge">학부연구생 모집</span>' : '';
    /* 세부 주제 키워드 (areaDetail 줄바꿈 → 콤마 · 2줄 클램프)
       area/areaDetail이 없는 연구실은 지어내지 않고 영문명만 표시 */
    var kw = '';
    if(l.areaDetail){
      var items = l.areaDetail.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      if(items.length) kw = '<div class="en" title="'+esc(items.join(' · '))+'">'+esc(items.join(' · '))+'</div>';
    }
    if(!kw && l.en) kw = '<div class="en">'+esc(l.en)+'</div>';
    /* 담당 교수 → 교수진 디렉토리(G-people) 행 딥링크 */
    var piInner = '<span class="cdot" aria-hidden="true"></span>'+esc(l.pi)+' 교수';
    var piCell = prof
      ? '<a class="pi" href="G-people.html#'+esc(prof.id)+'">'+piInner+'<span class="visually-hidden"> 프로필 보기</span></a>'
      : '<span class="pi">'+piInner+'</span>';
    /* 링크 열: 연구실 홈페이지 / 소개 영상 (값 있을 때만 — 없으면 교수명 링크가 상세 역할) */
    var links = [];
    if(l.site)  links.push('<a class="ext" href="'+esc(l.site)+'" target="_blank" rel="noopener">연구실 홈페이지 ↗<span class="visually-hidden"> (새 창)</span></a>');
    if(l.video) links.push('<a class="ext" href="'+esc(l.video)+'" target="_blank" rel="noopener">소개 영상 ↗<span class="visually-hidden"> (새 창)</span></a>');
    var act = links.length ? links.join('<br>') : '<span class="dim" aria-hidden="true">—</span>';
    var cells = '<div class="l-name"><div class="ko">'+nameKo+badge+'</div>'+kw+'</div>'
      + '<div class="l-pi">'+piCell
        + (role ? '<div class="role">'+esc(role)+'</div>' : '') + '</div>'
      + '<div class="l-loc">'+pin()+esc(l.loc)+'</div>'
      + '<div class="l-act">'+act+'</div>';
    if(!info){
      return '<div class="lab-row" id="'+esc(l.id)+'" role="group" aria-label="'+esc(l.ko+' · '+l.pi)+'">'+cells+'</div>';
    }
    /* 학부연구생 모집 상세 — <details> 접이식 (행/배지 클릭으로 토글) */
    var dl = '';
    if(info.target)  dl += '<dt>모집 대상</dt><dd>'+esc(info.target)+'</dd>';
    if(info.benefit) dl += '<dt>혜택</dt><dd>'+esc(info.benefit)+'</dd>';
    if(info.area){
      var topics = info.area.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      dl += '<dt>연구 주제</dt><dd><ul>'+topics.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ul></dd>';
    }
    var cnt = realVal(l.intern); /* "3명" 같은 실값만 노출, placeholder "O명" 제외 */
    return '<details class="lab-item" id="'+esc(l.id)+'">'
      + '<summary class="lab-row" aria-label="'+esc(l.ko+' · '+l.pi+' · 학부연구생 모집 상세 열기')+'">'+cells+'</summary>'
      + '<div class="intern-panel">'
        + '<div class="ip-head">학부연구생 · 인턴 모집'+(cnt ? ' — '+esc(cnt) : '')+'</div>'
        + '<dl class="ip-grid">'+dl+'</dl>'
      + '</div>'
      + '</details>';
  }

  var blocks = document.getElementById('clusterBlocks');
  blocks.innerHTML = clusters.map(function(c){
    var pct = Math.round(c.count/TOTAL*100);
    var rows = byCluster[c.id].map(function(l){ return labRow(l,c); }).join('');
    return '<section class="cluster" id="'+esc(c.id)+'" style="--cl-c:var('+CVAR[c.id]+')" aria-labelledby="h-'+esc(c.id)+'">'
      + '<div class="cl-head">'
        + '<div class="cl-code"><span class="cdot" aria-hidden="true"></span></div>'
        + '<div class="cl-titles">'
          + '<div class="ko" id="h-'+esc(c.id)+'">'+esc(c.ko)+'</div>'
          + '<p class="desc">'+esc(c.desc)+'</p>'
        + '</div>'
        + '<div class="cl-metric">'
          + '<div class="num tnum">'+String(c.count)+'<span class="u">개</span></div>'
          + '<div class="share">전체의 '+pct+'%</div>'
        + '</div>'
      + '</div>'
      + '<div class="lab-legend" aria-hidden="true">'
        + '<span>연구실</span><span>담당 교수</span><span>위치</span><span class="rt">링크</span>'
      + '</div>'
      + '<div class="lab-list">'+rows+'</div>'
      + '</section>';
  }).join('');

  /* ── 학부연구생 모집 요약 1줄 (실값 있는 연구실만 집계) ── */
  var internCount = labs.filter(function(l){ return !!internInfo(l); }).length;
  var internSum = document.getElementById('internSum');
  if(internSum && internCount){
    internSum.hidden = false;
    internSum.innerHTML = '현재 <b>학부연구생 모집 연구실 '+internCount+'곳</b> — 모집 배지가 붙은 행을 누르면 모집 대상·혜택·연구 주제가 열립니다.';
  }
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[시안 G · 관제] 소식 — 연세대학교 기계공학부</title>
<meta name="description" content="연세대학교 기계공학부 소식 — 학부·대학원 공지사항, 연구 뉴스, 세미나·행사 안내를 한곳에 모았습니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════════════
   시안 G — 소식 (라이트 테마)
   G-console 메인 하단 라이트 블록의 디자인 언어 계승:
   흰 배경 · 네이비 제목 · 코랄 킥커 · 헤어라인 목록 · 연회색 행 호버.
   히어로만 네이비(흰 대형 타이틀 + 연블루 킥커).
   섹션: 공지(#feed, 학부/대학원 탭) · 뉴스(#hi) · 세미나/행사(#sched).
   ═══════════════════════════════════════════════════════════ */
:root{
  --navy:#1a3d75;
  --coral:#e2593c;
  --body:#4a5a74;
  --sub:#5c6b85;
  --muted:#7b8595;
  --label:#9aa3b0;
  --dimmer:#7b8595;
  --line:rgba(10,26,51,.14);
  --line-soft:rgba(10,26,51,.08);
  --row:#f7f9fc;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --kr:"Pretendard Variable","Pretendard",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--kr);
  background:#fff; color:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden; word-break:keep-all;
  line-height:1.6;
}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.skip{position:absolute;left:.6rem;top:-3rem;z-index:60;background:var(--navy);color:#fff;
  padding:.55rem 1rem;font-size:.8rem;transition:top .15s}
.skip:focus{top:.6rem}

/* ── 페이지 히어로 (네이비) ── */
.hero{background:var(--navy);color:#fff;
  padding:7rem clamp(1.2rem,.6rem + 2vw,2.6rem) 3.2rem}
.hero-inner{max-width:1120px;margin:0 auto}
.hero .kick{font-size:.85rem;font-weight:600;letter-spacing:.08em;color:#9db4d8;margin-bottom:.9rem}
.hero h1{font-weight:800;letter-spacing:-.015em;
  font-size:clamp(2.1rem,1.3rem + 2.8vw,3rem);color:#fff;line-height:1.15}
.hero .lede{max-width:42rem;margin-top:1.1rem;font-size:1rem;color:#c6d2e4;line-height:1.75}
.hero .lede b{color:#fff;font-weight:600}

/* ── 섹션 공통 ── */
.sec{max-width:1120px;margin:0 auto;
  padding:clamp(3rem,2rem + 3.5vw,4.8rem) clamp(1.2rem,.6rem + 2vw,2.6rem);
  border-bottom:1px solid var(--line-soft)}
.sec:last-of-type{border-bottom:0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;
  gap:1.2rem 1.5rem;flex-wrap:wrap;margin-bottom:clamp(1.6rem,1rem + 1.6vw,2.4rem)}
.sec-kick{font-family:var(--mono);font-size:.66rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--coral)}
.sec-title{font-weight:700;color:var(--navy);
  font-size:clamp(1.5rem,1rem + 2vw,2.1rem);line-height:1.24;letter-spacing:-.01em;
  margin-top:.5rem}
.sec-count{font-size:.84rem;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.sec-note{max-width:44rem;margin-top:.8rem;font-size:.92rem;color:var(--sub);line-height:1.7;flex-basis:100%}

/* 공지 탭 (학부 / 대학원) */
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tab{display:inline-flex;align-items:baseline;gap:.5rem;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--sub);
  font-family:var(--kr);font-weight:600;font-size:.88rem;
  padding:.55rem 1.05rem;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.tab:hover{color:var(--navy);border-color:#b9c4d4}
.tab[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.tab .cnt{font-size:.78em;font-weight:500;color:var(--label);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"] .cnt{color:rgba(255,255,255,.8)}

/* ── 목록 (제목 + 날짜) ── */
.rows{border-top:1px solid var(--line)}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.4rem;align-items:baseline;
  padding:1.1rem .9rem;border-bottom:1px solid var(--line-soft);transition:background .12s}
a.nrow:hover{background:var(--row)}
.nrow .t{font-size:.96rem;color:#2a3a56;line-height:1.55;min-width:0}
a.nrow:hover .t{color:var(--navy)}
.nrow .d{font-family:var(--mono);font-size:.74rem;color:#8b93a3;letter-spacing:.04em;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.pin{display:inline-block;font-size:.7rem;font-weight:600;color:var(--coral);
  border:1px solid rgba(226,89,60,.45);padding:.1rem .45rem;margin-right:.55rem;
  vertical-align:.1em;white-space:nowrap}

/* ── 세미나 · 행사 2단 ── */
.duo{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(2rem,1rem + 3vw,3.5rem);align-items:start}
.duo h3{font-size:1.02rem;font-weight:700;color:var(--navy);margin-bottom:.9rem}
.duo h3 .cnt{font-size:.8rem;font-weight:500;color:var(--muted);margin-left:.45rem;
  font-variant-numeric:tabular-nums}
.duo .nrow{grid-template-columns:1fr;gap:.35rem;padding:1rem .9rem}
.duo .nrow .d{justify-self:start}

/* ── 반응형 ── */
@media (max-width:860px){
  .duo{grid-template-columns:1fr}
}
@media (max-width:640px){
  .nrow{grid-template-columns:1fr;gap:.35rem}
  .nrow .d{justify-self:start}
}
</style>
</head>
<body>
<a class="skip" href="#feed">공지사항 바로가기</a>

<main>
  <!-- 페이지 히어로 -->
  <header class="hero">
    <div class="hero-inner">
      <p class="kick">소식</p>
      <h1>공지 · 뉴스 · 세미나</h1>
      <p class="lede">학부·대학원 <b>공지사항</b>과 연구 <b>뉴스</b>, <b>세미나·행사</b> 안내를
        한곳에 모았습니다. 제목을 누르면 학부 홈페이지의 원문으로 이동합니다.</p>
    </div>
  </header>

  <!-- 공지사항 -->
  <section class="sec" id="feed" aria-labelledby="t-feed">
    <div class="sec-head">
      <div>
        <p class="sec-kick">공지</p>
        <h2 class="sec-title" id="t-feed">공지사항</h2>
      </div>
      <div class="tabs" role="group" aria-label="공지 구분" id="noticeTabs"></div>
    </div>
    <div class="rows" id="noticeRows"></div>
  </section>

  <!-- 뉴스 · 연구 성과 -->
  <section class="sec" id="hi" aria-labelledby="t-hi">
    <div class="sec-head">
      <div>
        <p class="sec-kick">뉴스</p>
        <h2 class="sec-title" id="t-hi">연구 성과와 소식</h2>
      </div>
      <span class="sec-count" id="newsCount"></span>
    </div>
    <div class="rows" id="newsRows"></div>
  </section>

  <!-- 세미나 · 행사 -->
  <section class="sec" id="sched" aria-labelledby="t-sched">
    <div class="sec-head">
      <div>
        <p class="sec-kick">세미나 · 행사</p>
        <h2 class="sec-title" id="t-sched">세미나와 행사</h2>
      </div>
    </div>
    <div class="duo">
      <div>
        <h3>세미나<span class="cnt" id="semCount"></span></h3>
        <div class="rows" id="semRows"></div>
      </div>
      <div>
        <h3>행사<span class="cnt" id="evtCount"></span></h3>
        <div class="rows" id="evtRows"></div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/data.js?v=d11"></script>
<script>
(function(){
  'use strict';

  /* ── 데이터 (공유 데이터 소스 window.YSME) ── */
  var D = window.YSME;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* 목록 행: 제목(+상단 고정 공지 표시) + 날짜, 원문 링크 */
  function itemRow(x){
    var pin = (x.no === '공지') ? '<span class="pin">공지</span>' : '';
    return '<a class="nrow" href="'+esc(x.url)+'" target="_blank" rel="noopener">'
      + '<span class="t">'+pin+esc(x.title)+'</span>'
      + '<time class="d">'+esc(x.date)+'</time>'
      + '</a>';
  }
  function renderList(el, list){ el.innerHTML = list.map(itemRow).join(''); }

  /* ── 공지사항: 학부 / 대학원 탭 ── */
  var noticeRows = document.getElementById('noticeRows');
  var tabWrap = document.getElementById('noticeTabs');
  var TABS = [
    { id:'ug',   label:'학부',   list:D.noticesUG },
    { id:'grad', label:'대학원', list:D.noticesGrad }
  ];
  var cur = 'ug';
  tabWrap.innerHTML = TABS.map(function(t){
    return '<button type="button" class="tab" data-tab="'+t.id+'" aria-pressed="'+(cur===t.id)+'">'
      + esc(t.label)+' <span class="cnt">'+t.list.length+'</span></button>';
  }).join('');

  function renderNotices(){
    var t = TABS.filter(function(x){ return x.id===cur; })[0];
    renderList(noticeRows, t.list);
    tabWrap.querySelectorAll('.tab').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.tab===cur));
    });
  }
  tabWrap.addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if(!b) return;
    if(b.dataset.tab===cur) return;
    cur = b.dataset.tab; renderNotices();
  });
  renderNotices();

  /* ── 뉴스 · 세미나 · 행사 ── */
  renderList(document.getElementById('newsRows'), D.newsList);
  renderList(document.getElementById('semRows'), D.seminars);
  renderList(document.getElementById('evtRows'), D.events);
  document.getElementById('newsCount').textContent = '전체 '+D.newsList.length+'건';
  document.getElementById('semCount').textContent = D.seminars.length+'건';
  document.getElementById('evtCount').textContent = D.events.length+'건';
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>YSME Studio 통합검사</title>
<style>
  body { font: 13px/1.65 ui-monospace, Consolas, monospace; padding: 1rem 1.2rem; }
  pre { white-space: pre-wrap; margin: 0; }
  .fail { color: #b3261e; font-weight: 700; }
  #verdict { margin-top: 1rem; padding: .6rem .9rem; border-radius: .5rem; font-weight: 700; }
  #verdict.pass { background: #e6f4ea; color: #0a6b39; }
  #verdict.fail { background: #fce8e6; color: #b3261e; }
  iframe { position: fixed; left: -20000px; top: 0; width: 1280px; height: 900px; border: 0; }
</style>
</head>
<body>
<h1 style="font-size:1.05rem;margin:0 0 .8rem">YSME In-Place Studio — 통합검사 (실제 페이지에 부팅 후 불변식 확인)</h1>
<div id="out"><pre>실행 중…</pre></div>
<img id="ysBlocker" src="/hang" alt="" style="display:none" />

<script>
/* 이 파일은 배포되지 않는다(.vercelignore). 서버 없이 Y.net 을 스텁으로 갈아끼워
   실제 사이트 페이지 위에 스튜디오를 부팅시키고, ../STUDIO_SPEC.md 10절의 합격 기준을 확인한다.
   테스트 전용이므로 사이트 코드 규약(ES5)을 따르지 않고 async/await 를 쓴다. */
(async function () {
  const PAGE = 'H-academic.html';
  const MODULES = ['core', 'net', 'source', 'align', 'engine', 'diff', 'changes', 'pagedict', 'hud', 'versions', 'ai', 'i18n-edit', 'mobile', 'datamap', 'posts'];
  const out = document.getElementById('out');
  let lines = [], fails = 0, warns = 0;

  const log = (ok, m) => { lines.push((ok ? '  ok   ' : ' FAIL  ') + m); if (!ok) fails++; paint(); };
  const warn = (m) => { lines.push(' warn  ' + m); warns++; paint(); };
  const info = (m) => { lines.push('       ' + m); paint(); };
  const head = (m) => { lines.push(''); lines.push('── ' + m); paint(); };
  function paint(done) {
    const esc = lines.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    let html = '<pre>' + esc.replace(/^ FAIL .*$/gm, m => '<span class="fail">' + m + '</span>') + '</pre>';
    if (done) html += '<div id="verdict" class="' + (fails ? 'fail' : 'pass') + '">' +
      (fails ? 'FAILED — 실패 ' + fails + '건 / 경고 ' + warns + '건' : 'PASSED — 실패 0건 / 경고 ' + warns + '건') + '</div>';
    out.innerHTML = html;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function loadFrame(url) {
    return new Promise(res => {
      const f = document.createElement('iframe');
      f.addEventListener('load', () => setTimeout(() => res(f), 700));
      f.src = url;
      document.body.appendChild(f);
    });
  }
  function inject(win, src) {
    return new Promise(res => {
      const s = win.document.createElement('script');
      s.src = src;
      s.onload = () => res(true);
      s.onerror = () => res(false);
      win.document.body.appendChild(s);
    });
  }

  try {
    /* ── 0. 준비: 이전 초안·언어 상태 제거 ── */
    localStorage.removeItem('ysme-lang');
    await new Promise(r => { const q = indexedDB.deleteDatabase('ysme-studio'); q.onsuccess = q.onerror = q.onblocked = () => r(); });
    sessionStorage.setItem('ysme-studio', JSON.stringify({ passcode: 'TEST', author: '검사자', ts: Date.now() }));

    const original = await (await fetch('../' + PAGE, { cache: 'no-store' })).text();

    head('부팅 (' + PAGE + ')');
    const f = await loadFrame('../' + PAGE);
    const w = f.contentWindow, d = f.contentDocument;

    /* 프레임 안 스크립트 오류 수집 */
    const errs = [];
    w.addEventListener('error', e => errs.push((e.message || 'error') + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
    const origErr = w.console.error;
    w.console.error = function () { errs.push('console.error: ' + Array.prototype.map.call(arguments, String).join(' ').slice(0, 200)); origErr.apply(w.console, arguments); };

    /* boot.js 는 프레임에서 스스로 멈추므로(정상) 모듈을 직접 순서대로 넣는다 */
    let loaded = 0;
    for (const m of MODULES) {
      const okm = await inject(w, '../assets/studio/' + m + '.js');
      if (okm) loaded++; else warn('모듈 로드 실패: ' + m);
      if (m === 'net') {                       // net 직후 스텁으로 교체 (서버 없이 동작)
        const Y = w.YStudio;
        window.__commits = [];
        Y.net = {
          call: () => Promise.resolve({}),
          auth: () => Promise.resolve({ ok: true, branch: 'main', basePath: 'design-candidates', headSha: 'sha-base' }),
          list: () => Promise.resolve({ pages: [{ path: PAGE, name: PAGE }], assets: [], headSha: 'sha-base' }),
          read: (p) => fetch('../' + p, { cache: 'no-store' }).then(r => {
            if (!r.ok) throw new Error(p + ' ' + r.status);
            return r.text();
          }).then(t => ({ content: t, blobSha: 'blob', ref: 'main' })),
          commit: (o) => { window.__commits.push(o); return Promise.resolve({ ok: true, commit: { sha: 'sha-new', html_url: '#' }, headSha: 'sha-new' }); },
          history: () => Promise.resolve({ commits: [] }),
          checkpoints: () => Promise.resolve({ items: [] }),
          ai: () => Promise.resolve({ text: '{}', data: {} })
        };
      }
    }
    log(loaded === MODULES.length, '모듈 ' + loaded + '/' + MODULES.length + ' 로드');

    const Y = w.YStudio;
    log(!!(Y && Y.engine && Y.hud), '핵심 전역(engine·hud) 존재');

    /* ── 1. 원문 확보 + 라이브 결합 + HUD 마운트 ── */
    Y.engine.setHeadSha('sha-base');
    await Y.engine.open(PAGE);
    log(Y.engine.mapped(), '원문 대응 성립' + (Y.engine.mapped() ? '' : ' — ' + Y.engine.reason()));
    log(Y.engine.src() === original, '부팅 직후 원문 바이트 동일');
    Y.engine.bindLive(d, w);
    const mp = Y.engine.map();
    log(!!mp && mp.stats.paired > 100, '정렬 성립 (짝 ' + (mp ? mp.stats.paired : 0) + ')');
    Y.hud.mount();
    await sleep(300);
    log(!!d.querySelector('[data-ys-ui]'), 'HUD 마운트됨');
    log(Y.engine.src() === original, 'HUD 마운트 후에도 원문 바이트 동일 (UI 오염 0)');

    /* ── 2. 편집 모드 + 선택 ── */
    head('편집 모드 · 선택');
    Y.hud.setEditing(true);
    log(Y.hud.editing() === true, '편집 모드 진입');
    const outline = Y.engine.outline({ max: 400 });
    log(outline.length > 10, '편집 대상 개요 ' + outline.length + '건 추출');
    const target = outline.find(o => o.text.length > 6 && /^(p|h1|h2|h3|span|a|li|strong|b|em)$/.test(o.tag)) || outline[0];
    Y.hud.select(target.idx);
    await sleep(150);
    log(Y.hud.selection() === target.idx, '요소 선택 (idx ' + target.idx + ' <' + target.tag + '>)');
    log(Y.engine.src() === original, '선택 후에도 원문 바이트 동일');

    /* ── 3. 텍스트 편집 → 초안 → 폐기 ── */
    head('텍스트 편집 · 초안 · 폐기');
    const before = Y.engine.info(target.idx).text;
    const marker = '통합검사문구QX';
    log(Y.engine.setText(target.idx, marker) === true, 'setText 적용');
    log(Y.engine.src().indexOf(marker) >= 0, '원문에 반영됨');
    log(Y.engine.src() !== original && Y.engine.dirty() === true, '더티 상태 표시');
    const liveEl = mp.liveOf(target.idx);
    log(!!liveEl && liveEl.textContent === marker, '화면에도 즉시 반영');
    await Y.engine.flush();
    const draft = await Y.store.get('drafts', PAGE);
    log(!!draft && draft.src.indexOf(marker) >= 0, '초안이 IndexedDB 에 저장됨');
    log(Y.engine.setText(target.idx, before) === true, '원래 문구로 되돌림');
    log(Y.engine.src() === original, '되돌린 뒤 바이트 동일');

    /* ── 4. UI 오염 최종 확인 ── */
    head('저장본 오염 검사');
    Y.engine.setText(target.idx, marker);
    const outSrc = Y.engine.src();
    log(outSrc.indexOf('data-ys-ui') < 0, '저장본에 data-ys-ui 없음');
    log(!/class="[^"]*\bys-[a-z]/.test(outSrc), '저장본에 ys- 클래스 없음');
    log(outSrc.indexOf('contenteditable') < 0, '저장본에 contenteditable 없음');
    log(!/\bclass="[^"]*\bsfade\b/.test(outSrc), '저장본에 런타임 클래스(sfade) 없음');
    log(!/\bstyle="[^"]*opacity/.test(outSrc.slice(outSrc.indexOf('<body'))) || original.indexOf('opacity') >= 0,
        '저장본에 스크롤 페이드 인라인 opacity 없음');
    const diffLen = Math.abs(outSrc.length - original.length);
    log(diffLen < 200, '변경량이 편집한 문구 범위 (' + diffLen + '바이트)');

    /* ── 5. 원자 게시 ── */
    head('원자 게시 (여러 파일 → 커밋 1개)');
    await Y.engine.flush();
    await Y.store.put('drafts', { path: 'assets/i18n/en.json', src: '{"테스트":"Test"}', origSrc: '{}', baseSha: 'sha-base', ts: Date.now(), author: '검사자' });
    const all = await Y.store.all('drafts');
    log(all.length === 2, '초안 2건 준비 (' + all.map(x => x.path).join(', ') + ')');
    window.__commits.length = 0;
    Y.hud.publish();
    await sleep(400);
    const okBtn = Array.prototype.slice.call(d.querySelectorAll('[data-ys-ui] button'))
      .filter(b => /게시/.test(b.textContent) && /is-pri/.test(b.className))[0];
    log(!!okBtn, '게시 확인 모달 표시' + (okBtn ? ' — "' + okBtn.textContent.trim() + '"' : ''));
    if (okBtn) {
      okBtn.click();
      await sleep(600);
      const c = window.__commits[0];
      log(window.__commits.length === 1, '커밋 호출 1회 (' + window.__commits.length + ')');
      log(!!c && c.files && c.files.length === 2, '커밋 1개에 파일 2개 포함' + (c && c.files ? ' — ' + c.files.map(x => x.path).join(', ') : ''));
      log(!!c && c.baseSha === 'sha-base', '낙관적 충돌 검사용 baseSha 전송');
      const left = await Y.store.all('drafts');
      log(left.length === 0, '게시 후 초안 비워짐 (' + left.length + '건 남음)');
    }

    /* ── 6. 한/영 — EN 편집이 HTML 을 건드리지 않는지 ── */
    head('한/영 전환');
    const srcBeforeLang = Y.engine.src();
    const koText = liveEl ? liveEl.textContent : '';
    w.localStorage.setItem('ysme-lang', 'en');
    if (Y.i18nEdit && Y.i18nEdit.setLang) { await Y.i18nEdit.setLang('en'); }
    else if (w.YSMEI18N && w.YSMEI18N.apply) { await w.YSMEI18N.apply('en'); }
    else warn('i18n 재적용 API 를 찾지 못해 수동 확인 필요');
    await sleep(700);
    log(Y.engine.src() === srcBeforeLang, 'EN 전환이 HTML 원문을 바꾸지 않음');
    const enChanged = Array.prototype.slice.call(d.querySelectorAll('h2, h3, p, a'))
      .some(el => /[A-Za-z]{4,}/.test(el.textContent) && !/[가-힣]/.test(el.textContent));
    log(enChanged, '화면 일부가 영어로 전환됨');
    w.localStorage.removeItem('ysme-lang');

    /* ── 7. 페이지 이동 지속 ── */
    head('페이지 이동 후 초안 지속');
    /* 앞 단계(게시)가 기준선을 바꿨으므로 이 검사만 독립적으로 리셋한다 */
    await Y.store.clear('drafts');
    await Y.engine.open(PAGE);
    log(Y.engine.src() === original, '기준선 초기화 (원본 재확보)');
    const marker2 = '이동지속검사문구ZQ';
    log(Y.engine.setText(target.idx, marker2) === true, '이동 전 편집 적용');
    await Y.engine.flush();
    const f2 = await loadFrame('../' + PAGE);
    const w2 = f2.contentWindow, d2 = f2.contentDocument;
    for (const m of MODULES) {
      await inject(w2, '../assets/studio/' + m + '.js');
      if (m === 'net') { w2.YStudio.net = Y.net; }
    }
    const Y2 = w2.YStudio;
    Y2.engine.setHeadSha('sha-base');
    await Y2.engine.open(PAGE);
    log(Y2.engine.src().indexOf(marker2) >= 0, '새 문서에서 초안을 이어받음');
    log(Y2.engine.dirty() === true, '더티 상태 유지');
    await Y2.engine.discardDraft();
    log(Y2.engine.src() === original, '초안 폐기 후 원본 복귀');

    /* ── 8. 모바일 모드 ── */
    head('모바일 렌더 모드');
    if (Y.mobile && Y.mobile.open) {
      Y.mobile.open();
      await sleep(1600);
      const fr = d.querySelector('[data-ys-ui] iframe');
      log(!!fr, '모바일 프레임 생성');
      if (fr) {
        const fw = fr.getBoundingClientRect().width;
        log(fw > 300 && fw < 460, '프레임 폭 ' + Math.round(fw) + 'px (모바일)');
        const fd = fr.contentDocument;
        if (fd) {
          const burger = fd.querySelector('.ynv-burger');
          const shown = burger && fr.contentWindow.getComputedStyle(burger).display !== 'none';
          log(!!shown, '모바일 햄버거 메뉴 노출' + (shown ? '' : ' — 미디어쿼리 재현 실패'));
        } else warn('프레임 문서를 읽을 수 없음');
      }
      Y.mobile.close();
      await sleep(300);
      log(!d.querySelector('[data-ys-ui] iframe'), '모바일 모드 종료');
      log(Y.engine.src() === original || Y.engine.src() === srcBeforeLang, '모바일 모드가 원문을 바꾸지 않음');
    } else warn('Y.mobile 없음');

    /* ── 8b. 패널 등록·버튼 연결 (계약검사 T1 회귀) ── */
    head('패널 등록 · 버튼 연결');
    for (const pid of ['inspect', 'versions', 'ai', 'lang']) {
      Y.hud.openPanel(pid);
      await sleep(120);
      log(Y.hud.isOpen(pid) === true, "패널 '" + pid + "' 열림");
    }
    const btns = Array.prototype.slice.call(d.querySelectorAll('[data-ys-ui] button'));
    const langBtn = btns.filter(b => /한/.test(b.textContent) && /영/.test(b.textContent))[0];
    log(!!langBtn, '한·영 버튼 존재');
    if (langBtn) {
      log(!/is-off/.test(langBtn.className), '한·영 버튼이 활성 상태(준비 중 아님)');
      Y.hud.closePanel();
      await sleep(120);
      langBtn.click();
      await sleep(250);
      log(Y.hud.isOpen('lang') === true, '한·영 버튼 클릭 → 사전 패널 열림');
    }

    /* ── 8c. 이름 붙인 시점 저장 (서버 경로 검증 회귀 — 계약검사 T2) ── */
    head('시점 저장 (체크포인트)');
    if (Y.versions && Y.versions.save) {
      await Y.store.clear('drafts');
      await Y.engine.open(PAGE);
      Y.engine.setText(target.idx, '시점검사문구ZW');
      await Y.engine.flush();
      Y.hud.openPanel('versions');
      await sleep(350);
      const nameEl = d.querySelector('[data-ys-ui] .ys-vs-name');
      log(!!nameEl, '시점 이름 입력칸 표시');
      if (nameEl) {
        nameEl.value = '통합검사 시점';
        nameEl.dispatchEvent(new w.Event('input', { bubbles: true }));
        window.__commits.length = 0;
        await Y.versions.save();
        await sleep(300);
        const cc = window.__commits[0];
        log(!!cc, '시점 저장이 커밋을 호출');
        if (cc) {
          const paths = (cc.files || []).map(x => x.path);
          log(paths.indexOf(Y.versions.CP_PATH) >= 0, '매니페스트(' + Y.versions.CP_PATH + ')가 같은 커밋에 포함 — ' + paths.join(', '));
          const manifest = (cc.files || []).filter(x => x.path === Y.versions.CP_PATH)[0];
          let entry = null;
          try { const parsed = JSON.parse(manifest.content); entry = (parsed.items || parsed)[0]; } catch (e) {}
          log(!!entry && entry.name === '통합검사 시점' && !!entry.ts && !!entry.author,
            '매니페스트에 이름·시각·작성자 기록' + (entry ? ' — ' + entry.name + ' / ' + new Date(entry.ts).toISOString().slice(0, 16) + ' / ' + entry.author : ''));
          /* 이 경로가 서버 검증을 통과하는지는 api-smoke 에서 별도로 확인한다 */
        }
      }
      await Y.store.clear('drafts');
      await Y.engine.open(PAGE);
    } else warn('Y.versions.save 없음');

    /* ── 8d. 모바일 프레임 클릭 1회 = 선택 1회 (계약검사 I2 회귀) ── */
    head('모바일 프레임 클릭 중복 처리');
    if (Y.mobile && Y.mobile.open) {
      Y.hud.setEditing(true);
      Y.mobile.open();
      /* 프레임 로드 + 엔진 재바인딩이 끝날 때까지 기다린다(고정 sleep 은 느린 환경에서 흔들린다) */
      let fr2 = null, fd2 = null;
      for (let i = 0; i < 60; i++) {
        await sleep(200);
        fr2 = d.querySelector('[data-ys-ui] iframe');
        fd2 = fr2 && fr2.contentDocument;
        if (fd2 && fd2.readyState === 'complete' && Y.engine.liveDoc() === fd2 && Y.engine.map()) break;
      }
      log(!!fd2 && Y.engine.liveDoc() === fd2, '엔진이 프레임 문서에 재바인딩됨');
      if (fd2) {
        let hits = 0;
        const onSel = () => { hits++; };
        Y.bus.on('hud:select', onSel);
        const clickable = fd2.querySelector('main h2, main p, .stats .st b, h1');
        if (clickable) {
          clickable.dispatchEvent(new fr2.contentWindow.MouseEvent('click', { bubbles: true, cancelable: true }));
        }
        await sleep(300);
        Y.bus.off('hud:select', onSel);
        log(hits === 1, '프레임 안 클릭 1회 → 선택 처리 ' + hits + '회');
      } else warn('프레임 문서 접근 불가');
      Y.mobile.close();
      await sleep(250);
    }

    /* ── 8e. 홈 내장 사전 문장을 인스펙터에서 바로 고치기 ── */
    head('홈 사전 문장 인플레이스 편집');
    await Y.store.clear('drafts');
    await Y.engine.open(PAGE);
    Y.engine.bindLive(d, w);
    log(Y.engine.src() === original, '기준선 초기화 (원본 재확보)');
    if (Y.pagedict) {
      log(Y.pagedict.available() === true, '내장 사전(var I18N) 인식' +
        (Y.pagedict.available() ? '' : ' — ' + Y.pagedict.reason()));
      log(Y.pagedict.langs().join(',') === 'ko,en', '언어 ko,en 인식 (' + Y.pagedict.langs().join(',') + ')');

      const h1 = d.querySelector('h1[data-i18n="heroTitle"]');
      const hIdx = h1 ? Y.engine.indexFromLive(h1) : null;
      log(hIdx != null, '사전 문장 요소를 원문 인덱스로 찾음 (eid ' + hIdx + ')');
      if (hIdx != null) {
        const hInfo = Y.engine.info(hIdx);
        log(hInfo.runtime === 'i18n', '사전 관리 요소로 판별');
        const srcD = Y.engine.src();
        const koWas = Y.pagedict.get('heroTitle', 'ko');
        const enWas = Y.pagedict.get('heroTitle', 'en');
        log(koWas === '연세대학교 기계공학부', '한국어 사전 값 읽음 — "' + koWas + '"');
        log(/^School of/.test(enWas), '영어 사전 값 읽음 — "' + enWas + '"');

        const curLang = Y.pagedict.liveLang();
        const NEWKO = '연세대 기계공학부 (사전검사)';
        log(Y.pagedict.set('heroTitle', 'ko', NEWKO, hIdx) === true, '한국어 사전 값 수정');
        log(Y.engine.src().indexOf("heroTitle: '" + NEWKO + "'") >= 0, '원문 사전에 반영');
        log(Y.engine.src().indexOf('<h1 data-i18n="heroTitle">' + NEWKO + '</h1>') >= 0,
            'HTML 폴백 텍스트도 함께 동기화');
        if (curLang === 'ko') log(h1.textContent === NEWKO, '화면에 즉시 반영');
        else info('   화면이 영어 상태라 한국어 수정은 화면에 안 보이는 것이 정상');

        const NEWEN = 'YSME Dictionary Test';
        const srcBeforeEn = Y.engine.src();
        log(Y.pagedict.set('heroTitle', 'en', NEWEN, hIdx) === true, '영어 사전 값 수정');
        log(Y.pagedict.get('heroTitle', 'en') === NEWEN, '영어 값 반영');
        log(Y.engine.src().indexOf('<h1 data-i18n="heroTitle">' + NEWKO + '</h1>') >= 0,
            '영어 수정은 HTML 폴백을 건드리지 않음');
        log(Math.abs(Y.engine.src().length - srcBeforeEn.length) < 60, '영어 수정 변경량이 그 문장 범위');

        Y.pagedict.set('heroTitle', 'en', enWas, hIdx);
        Y.pagedict.set('heroTitle', 'ko', koWas, hIdx);
        log(Y.engine.src() === srcD, '두 값 되돌린 뒤 바이트 동일');
        log(Y.engine.src().indexOf('data-ys-ui') < 0, '사전 편집이 저장본을 오염시키지 않음');
      }
    } else warn('Y.pagedict 없음');

    /* ── 8f. 카운트업 숫자 ── */
    head('카운트업 숫자 편집');
    const cnt = d.querySelector('[data-count]');
    const cIdx = cnt ? Y.engine.indexFromLive(cnt) : null;
    if (cIdx != null) {
      const cInfo = Y.engine.info(cIdx);
      log(cInfo.runtime === 'count', 'data-count 요소로 판별');
      const cWas = cInfo.attrs['data-count'];
      const srcC = Y.engine.src();
      log(Y.engine.setAttr(cIdx, 'data-count', '44') === true, '목표 숫자 44 로 변경');
      log(Y.engine.src().indexOf('data-count="44"') >= 0, '원문 속성에 반영');
      Y.engine.setAttr(cIdx, 'data-count', cWas);
      log(Y.engine.src() === srcC, '되돌린 뒤 바이트 동일');
    } else warn('data-count 요소를 찾지 못함');

    /* ── 8g. 공지 등록 ── */
    head('공지 · 소식 등록');
    if (Y.posts && Y.datamap) {
      await Y.datamap.load();
      const n0 = Y.datamap.items('noticesUG').length;
      log(n0 > 0, 'noticesUG ' + n0 + '건 읽음');
      const TITLE = '통합검사용 공지 — 등록 확인';
      await Y.posts.add('noticesUG', {
        no: '공지', title: TITLE, date: '2026.07.26', url: 'https://example.com/n', att: false
      });
      const rows = Y.datamap.items('noticesUG');
      log(rows.length === n0 + 1, '항목 1건 추가 (' + n0 + ' → ' + rows.length + ')');
      log(rows[0].item.title === TITLE, '맨 앞(최신)에 들어감');
      log(rows[0].pending === true && rows[1].pending === false, '새 항목만 미게시로 표시');
      const dd = await Y.store.get('drafts', 'assets/js/data.js');
      log(!!dd && dd.src.indexOf(TITLE) >= 0, 'data.js 초안이 저장됨');
      /* 초안이 실제로 실행 가능한 JS 인지 — 구문이 깨지면 사이트가 통째로 죽는다 */
      let evalOk = false;
      try { evalOk = !!(new Function('window', dd.src + ';return window.YSME;'))({}).noticesUG; } catch (e) { evalOk = false; }
      log(evalOk, '초안 data.js 가 구문 오류 없이 평가됨');
      await Y.posts.remove('noticesUG', 0);
      log(Y.datamap.items('noticesUG').length === n0, '삭제 후 원래 개수로 복귀');
      log(!(await Y.store.get('drafts', 'assets/js/data.js')), '원본과 같아져 초안이 정리됨');
      /* core.js 회귀: 없는 키를 조회하면 undefined 여야 한다(IDBRequest 가 새면 안 됨) */
      log((await Y.store.get('drafts', '없는파일.html')) === undefined,
          'store.get 이 없는 키에 undefined 를 돌려줌');

      Y.hud.openPanel('post');
      await sleep(600);
      const ph = d.querySelector('[data-ys-panel="post"]');
      log(!!ph && /분류/.test(ph.textContent), '글 등록 패널이 그려짐');
      log(!!ph && ph.querySelectorAll('select option').length === Y.posts.kinds().length,
          '분류 ' + Y.posts.kinds().length + '종이 선택지로 나옴');
      Y.hud.closePanel();
      await sleep(150);
    } else warn('Y.posts 또는 Y.datamap 없음');

    /* ── 8h. 시점 비교를 사람 말로 ── */
    head('시점 비교 — 사람이 읽는 변경 목록');
    if (Y.changes) {
      await Y.store.clear('drafts');
      await Y.engine.open(PAGE);
      Y.engine.bindLive(d, w);
      const base = Y.engine.src();

      /* (1) 글 수정 · (2) 글자 크기 · (3) 링크 주소 — 세 종류를 한 번에 심는다 */
      const h2 = d.querySelector('h2[data-i18n="peopleTitle"]') || d.querySelector('main h2');
      const hIdx = h2 ? Y.engine.indexFromLive(h2) : null;
      const link = d.querySelector('main a[href]');
      const lIdx = link ? Y.engine.indexFromLive(link) : null;
      let edited = base;
      /* 72px — 이 제목에는 이미 58px 인라인 스타일이 게시돼 있어 같은 값을 넣으면 무변경이 된다 */
      if (hIdx != null) { Y.engine.setText(hIdx, '우리 교수진'); Y.engine.setStyleProp(hIdx, 'font-size', '72px'); }
      if (lIdx != null) Y.engine.setAttr(lIdx, 'href', 'G-people.html?t=1');
      edited = Y.engine.src();
      log(edited !== base, '비교용 편집 3종 적용');

      const res = Y.changes.of(PAGE, base, edited);
      log(res.ok === true, '항목별 비교 성공' + (res.ok ? '' : ' — ' + res.reason));
      const kinds = res.list.map(c => c.type);
      log(kinds.indexOf('text') >= 0, '글 수정을 잡아냄');
      log(kinds.indexOf('style') >= 0, '글자 크기 변경을 잡아냄');
      log(kinds.indexOf('attr') >= 0, '링크 주소 변경을 잡아냄');
      const t = res.list.find(c => c.type === 'text');
      log(!!t && t.after === '우리 교수진' && /교수진|People/.test(t.before + t.where),
          '전/후 문구가 사람 말로 담김 — 「' + (t ? t.before + '」 → 「' + t.after : '') + '」');
      const st = res.list.find(c => c.type === 'style');
      log(!!st && /글자 크기/.test(st.label) && /72px/.test(st.after), '스타일 설명이 한글 — ' + (st ? st.label + ' ' + st.after : ''));
      log(res.list.every(c => c.where && c.label), '모든 항목에 위치·설명이 있다');
      /* 제목이 바뀌면 자기 구역을 가리켜야 한다 — 바로 앞 제목(다른 구역)을 가리키면 오해를 부른다 */
      log(!!t && /우리 교수진/.test(t.where), '제목 변경의 위치가 자기 구역 — "' + (t ? t.where : '') + '"');
      log(t && t.idxNew != null, '변경 항목이 화면 점프용 인덱스를 가진다');
      const sm = Y.changes.summarize(res.list);
      log(/건/.test(sm), '요약 문장 — "' + sm + '"');
      log(!/[<>{}]|null|undefined/.test(sm + res.list.map(c => c.label).join('')),
          '요약·설명에 코드 조각이 섞이지 않았다');

      /* 변경 없음 */
      const same = Y.changes.of(PAGE, base, base);
      log(same.ok && same.list.length === 0, '같은 판본은 변경 0건');

      /* data.js — 항목 추가를 사람 말로 */
      const dsrc = (await Y.net.read('assets/js/data.js')).content;
      /* 파일이 CRLF 라 '\n' 리터럴로는 못 찾는다 — 줄끝에 무관한 정규식으로 끼워 넣는다 */
      const item = '{ "no": "공지", "title": "비교검사용 공지", "date": "2026.07.26", "url": "", "att": false },';
      const inserted = dsrc.replace(/("noticesUG"\s*:\s*\[)/, '$1\n  ' + item);
      log(inserted !== dsrc, 'data.js 에 검사용 항목을 끼워 넣었다');
      const dres = Y.changes.of('assets/js/data.js', dsrc, inserted);
      /* 1건만 넣었으면 정확히 1건이어야 한다 — 제목 중복 항목이 거짓으로 잡히면 안 된다 */
      log(dres.ok && dres.list.length === 1,
          'data.js 1건 추가 → 변경도 정확히 1건 (' + (dres.list || []).length + '건)' +
          (dres.list && dres.list.length > 1 ? ' — 거짓양성: ' + dres.list.slice(1, 4).map(c => c.label + '/' + c.where).join(', ') : ''));
      log(dres.ok && dres.list.some(c => c.type === 'data-add' && /비교검사용 공지/.test(c.after)),
          'data.js 새 글을 "학부 공지 새 글"로 설명');
      log(dres.ok && dres.list.length > 0 && dres.list.every(c => !/noticesUG/.test(c.label + c.where)),
          '설명에 내부 배열 이름이 안 나온다 — "' + (dres.list[0] ? dres.list[0].label + ' / ' + dres.list[0].where : '') + '"');

      /* en.json */
      const ires = Y.changes.of('assets/i18n/en.json', '{"연구 분야":"Areas"}', '{"연구 분야":"Research Areas"}');
      log(ires.ok && ires.list.length === 1 && /번역 수정/.test(ires.list[0].label), '영어 번역 수정을 잡아냄');

      await Y.engine.discardDraft();
      log(Y.engine.src() === base, '비교 검사 후 원문 복귀');
    } else warn('Y.changes 없음');

    /* ── 9. 오류 없음 ── */
    head('런타임 오류');
    log(errs.length === 0, '스크립트 오류 ' + errs.length + '건');
    errs.slice(0, 8).forEach(e => info('   ' + e));

  } catch (e) {
    log(false, '검사 중 예외: ' + (e && e.message) + (e && e.stack ? ' | ' + String(e.stack).split('\n')[1] : ''));
  }

  head('결과');
  info('실패 ' + fails + '건 · 경고 ' + warns + '건');
  paint(true);
  document.title = (fails ? 'FAIL' : 'PASS') + ' ' + fails + '/' + warns;
  try { sessionStorage.removeItem('ysme-studio'); localStorage.removeItem('ysme-lang'); } catch (e) {}
  const b = document.getElementById('ysBlocker');
  if (b && b.parentNode) b.parentNode.removeChild(b);
})();
</script>
</body>
</html>

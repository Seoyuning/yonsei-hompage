<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>YSME Studio 화면 확인</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #f { position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- 배포되지 않는다(.vercelignore). 스튜디오 UI 를 실제로 렌더해 눈으로 확인하기 위한 하네스.
     사용: chrome --headless --screenshot=out.png --window-size=1280,900 \
           "http://127.0.0.1:8124/_studio/shot.html?panel=versions"
     panel = inspect | versions | ai | lang | mobile | none -->
<img id="ysBlocker" src="/hang" alt="" style="display:none" />
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const PAGE = q.get('page') || 'H-academic.html';
  const PANEL = q.get('panel') || 'inspect';
  const MODULES = ['core', 'net', 'source', 'align', 'engine', 'diff', 'hud', 'versions', 'ai', 'i18n-edit', 'mobile', 'datamap'];
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  sessionStorage.setItem('ysme-studio', JSON.stringify({ passcode: 'DEMO', author: '김편집', ts: Date.now() }));
  await new Promise(r => { const d = indexedDB.deleteDatabase('ysme-studio'); d.onsuccess = d.onerror = d.onblocked = () => r(); });

  const f = document.createElement('iframe');
  f.id = 'f';
  await new Promise(res => { f.addEventListener('load', () => setTimeout(res, 700)); f.src = '../' + PAGE; document.body.appendChild(f); });
  const w = f.contentWindow, d = f.contentDocument;

  function inject(src) {
    return new Promise(res => {
      const s = d.createElement('script');
      s.src = src; s.onload = s.onerror = () => res();
      d.body.appendChild(s);
    });
  }
  for (const m of MODULES) {
    await inject('../assets/studio/' + m + '.js');
    if (m === 'net') {
      const Y = w.YStudio;
      Y.net = {
        call: () => Promise.resolve({}),
        auth: () => Promise.resolve({ ok: true, headSha: 'sha-demo' }),
        list: () => Promise.resolve({ pages: [{ path: PAGE, name: PAGE }], assets: [], headSha: 'sha-demo' }),
        read: (p) => fetch('../' + p, { cache: 'no-store' }).then(r => r.text()).then(t => ({ content: t, blobSha: 'b', ref: 'main' })),
        commit: () => Promise.resolve({ ok: true, commit: { sha: 'sha-new', html_url: '#' }, headSha: 'sha-new' }),
        history: () => Promise.resolve({
          commits: [
            { sha: 'aaaaaaa1', message: 'YSME 게시: G-people.html (김편집)', author: '김편집', date: new Date(Date.now() - 3600e3).toISOString(), html_url: '#' },
            { sha: 'bbbbbbb2', message: '구성원 카드 텍스트 위계 재정립', author: 'Seoyuning', date: new Date(Date.now() - 86400e3).toISOString(), html_url: '#' }
          ]
        }),
        checkpoints: () => Promise.resolve({
          items: [
            { id: 'cp-1', name: '학사 안내 개편 전', note: '표 구조 바꾸기 직전', ts: Date.now() - 7200e3, author: '김편집', commitSha: 'aaaaaaa1', files: ['G-academics.html', 'assets/js/data.js'] },
            { id: 'cp-2', name: '영문 1차 검수 완료', note: '', ts: Date.now() - 172800e3, author: 'Seoyuning', commitSha: 'bbbbbbb2', files: ['assets/i18n/en.json'] }
          ]
        }),
        ai: () => Promise.resolve({ text: '{}', data: {} })
      };
    }
  }

  const Y = w.YStudio;
  Y.engine.setHeadSha('sha-demo');
  await Y.engine.open(PAGE);
  Y.engine.bindLive(d, w);
  Y.hud.mount();
  await sleep(300);
  Y.hud.setEditing(true);

  /* 인스펙터를 의미 있게 보이도록 텍스트 요소 하나를 선택해 둔다 */
  const outline = Y.engine.outline({ max: 400 });
  const t = outline.filter(o => o.text.length > 8 && /^(h2|h3|p)$/.test(o.tag))[0] || outline[0];
  if (t) Y.hud.select(t.idx);
  await sleep(250);

  if (PANEL === 'mobile') { Y.mobile.open(); await sleep(1800); }
  else if (PANEL === 'publish') {
    /* 게시 확인 모달 — 초안 2건을 심어 실제 흐름 그대로 띄운다 */
    if (t) Y.engine.setText(t.idx, '연세대학교 기계공학부는 사람을 남깁니다');
    await Y.engine.flush();
    await Y.store.put('drafts', {
      path: 'assets/i18n/en.json', src: '{"연구 분야":"Research Areas"}', origSrc: '{}',
      baseSha: 'sha-demo', ts: Date.now(), author: '김편집'
    });
    Y.hud.publish();
    await sleep(900);
  } else if (PANEL !== 'none') { Y.hud.openPanel(PANEL); await sleep(700); }

  await sleep(400);
  const b = document.getElementById('ysBlocker');
  if (b && b.parentNode) b.parentNode.removeChild(b);
})();
</script>
</body>
</html>

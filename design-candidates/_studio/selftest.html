<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>YSME Studio 자기검사</title>
<style>
  body { font: 13px/1.65 ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 1rem 1.2rem; color: #16202e; }
  h1 { font-size: 1.05rem; margin: 0 0 .8rem; }
  pre { white-space: pre-wrap; margin: 0; }
  .fail { color: #b3261e; font-weight: 700; }
  #verdict { margin-top: 1rem; padding: .6rem .9rem; border-radius: .5rem; font-weight: 700; }
  #verdict.pass { background: #e6f4ea; color: #0a6b39; }
  #verdict.fail { background: #fce8e6; color: #b3261e; }
  #frames { position: fixed; left: -20000px; top: 0; width: 1280px; height: 900px; }
</style>
</head>
<body>
<h1>YSME In-Place Studio — 자기검사 (원문 스캔 · 오프셋 · 라운드트립 · 정렬)</h1>
<div id="out"><pre>실행 중…</pre></div>
<div id="frames" aria-hidden="true"></div>
<!-- 헤드리스 검증용: 검사가 끝날 때까지 load 이벤트를 붙잡아 둔다(끝나면 스크립트가 제거한다). -->
<img id="ysBlocker" src="/hang" alt="" style="display:none" />

<script src="../assets/studio/core.js"></script>
<script src="../assets/studio/source.js"></script>
<script src="../assets/studio/align.js"></script>
<script>
/* 이 페이지는 배포되지 않는다(.vercelignore). 로컬 서버에서 열어 검증한다.
   합격 기준은 ../STUDIO_SPEC.md 10절 1~3번(라운드트립 무결성 · 오염 차단 · JS 소유 판별). */
(function () {
  'use strict';
  var PAGES = ['H-academic.html', 'G-about.html', 'G-people.html', 'G-research.html',
               'G-academics.html', 'G-graduate.html', 'G-news.html', 'G-admissions.html'];
  /* 페이지별로 "사이트 JS 가 innerHTML 로 만드는" 컨테이너 — 그 자식은 짝이 없어야 한다 */
  var JS_OWNED = {
    'H-academic.html': ['newsGrid', 'ntList', 'smList', 'areaGrid', 'pGrid'],
    'G-people.html': ['rows'],
    'G-research.html': ['fieldGrid', 'clusterBlocks'],
    'G-news.html': ['newsRows', 'semRows', 'evtRows'],
    'G-graduate.html': ['gradClusterBlocks'],
    'G-admissions.html': ['schInternal']
  };

  var S = window.YStudio.source, out = document.getElementById('out');
  var lines = [], fails = 0, warns = 0;

  function log(ok, msg) { lines.push((ok ? '  ok   ' : ' FAIL  ') + msg); if (!ok) fails++; }
  function warn(msg) { lines.push(' warn  ' + msg); warns++; }
  function info(msg) { lines.push('       ' + msg); }
  function head(t) { lines.push(''); lines.push('── ' + t); }
  function paint(done) {
    var esc = lines.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    var html = '<pre>' + esc.replace(/^ FAIL .*$/gm, function (m) { return '<span class="fail">' + m + '</span>'; }) + '</pre>';
    if (done) {
      html += '<div id="verdict" class="' + (fails ? 'fail' : 'pass') + '">' +
        (fails ? 'FAILED — 실패 ' + fails + '건 / 경고 ' + warns + '건' : 'PASSED — 실패 0건 / 경고 ' + warns + '건') +
        '</div>';
    }
    out.innerHTML = html;
  }

  function fetchText(p) {
    return fetch('../' + p, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(p + ' HTTP ' + r.status);
      return r.text();
    });
  }

  function loadFrame(p) {
    return new Promise(function (res) {
      var f = document.createElement('iframe');
      f.width = 1280; f.height = 900;
      f.addEventListener('load', function () {
        /* 사이트 JS(nav.js mount, data.js 렌더, 리빌 옵저버)가 끝날 시간을 준다 */
        setTimeout(function () { res(f); }, 700);
      });
      f.src = '../' + p;
      document.getElementById('frames').appendChild(f);
    });
  }

  function testPage(p) {
    head(p);
    var src, doc, scanned, z;
    return fetchText(p).then(function (t) {
      src = t;
      info('바이트 ' + src.length + ' · 줄 ' + (src.split('\n').length) + ' · CRLF ' + (/\r\n/.test(src) ? '있음' : '없음'));

      /* 1) 스캔 */
      scanned = S.scan(src);
      log(scanned.ok, '원문 스캔' + (scanned.ok ? ' (요소 ' + scanned.els.length + '개)' : ' — ' + scanned.error));
      if (!scanned.ok) return;

      /* 2) DOM 과 1:1 대응(zip) */
      doc = new DOMParser().parseFromString(src, 'text/html');
      z = S.zip(doc, scanned);
      log(z.ok, 'DOM 전순회 대응' + (z.ok ? '' : ' — ' + z.reason));
      if (!z.ok) return;

      /* 3) 오프셋 정합성 */
      var bad = 0, badSample = '';
      for (var i = 0; i < z.els.length; i++) {
        var el = z.els[i], open = src.slice(el.openStart, el.openEnd);
        var okOpen = open.charAt(0) === '<' && open.charAt(open.length - 1) === '>' &&
          open.slice(1, 1 + el.tag.length).toLowerCase() === el.tag;
        var okOrder = el.innerStart <= el.innerEnd && el.innerEnd <= el.endStart && el.endStart <= el.endEnd;
        if (!okOpen || !okOrder) { if (!bad) badSample = i + ':<' + el.tag + '> ' + JSON.stringify(open.slice(0, 40)); bad++; }
      }
      log(bad === 0, '오프셋 정합성' + (bad ? ' — 이상 ' + bad + '건, 예: ' + badSample : ''));

      /* 4) 텍스트 라운드트립 — 고쳤다 되돌리면 바이트 동일해야 한다 */
      var leaf = -1;
      for (var k = 0; k < z.nodes.length; k++) {
        var n = z.nodes[k];
        if (n.children.length) continue;
        if (/^(script|style|title|meta|link|img|br|hr|input|textarea)$/.test(n.tagName.toLowerCase())) continue;
        var raw = src.slice(z.els[k].innerStart, z.els[k].innerEnd);
        if (raw.length > 3 && raw.indexOf('&') < 0 && !/[<>]/.test(raw) && /\S/.test(raw)) { leaf = k; break; }
      }
      if (leaf < 0) { warn('텍스트 리프를 찾지 못해 라운드트립 생략'); }
      else {
        var el0 = z.els[leaf], orig = S.text(src, el0);
        var edited = S.setText(src, el0, '테스트문구ZZ');
        log(edited !== src && edited.indexOf('테스트문구ZZ') >= 0, '텍스트 편집 반영 (요소 ' + leaf + ' <' + el0.tag + '>)');
        var z2 = S.zip(new DOMParser().parseFromString(edited, 'text/html'), S.scan(edited));
        log(z2.ok, '편집 후 재스캔·대응 유지');
        if (z2.ok) {
          var back = S.setText(edited, z2.els[leaf], orig);
          log(back === src, '텍스트 되돌림 후 바이트 동일');
        }
      }

      /* 5) 속성 라운드트립 */
      var withAttr = -1;
      for (var a = 0; a < z.nodes.length; a++) {
        if (z.nodes[a].getAttribute('class')) { withAttr = a; break; }
      }
      if (withAttr < 0) warn('class 속성을 가진 요소가 없어 속성 테스트 생략');
      else {
        var e1 = z.els[withAttr];
        var added = S.setAttr(src, e1, 'data-ys-test', '1');
        log(added.indexOf('data-ys-test="1"') >= 0, '속성 추가');
        var z3 = S.zip(new DOMParser().parseFromString(added, 'text/html'), S.scan(added));
        log(z3.ok, '속성 추가 후 대응 유지');
        if (z3.ok) log(S.setAttr(added, z3.els[withAttr], 'data-ys-test', null) === src, '속성 제거 후 바이트 동일');
        var clsVal = S.getAttr(src, e1, 'class');
        log(clsVal === z.nodes[withAttr].getAttribute('class'), '속성 읽기가 DOM 과 일치');
      }

      /* 6) 엔티티 재인코딩 영향 — 편집 시 표기가 바뀔 수 있는 요소 수(정보) */
      var reenc = 0;
      for (var q = 0; q < z.nodes.length; q++) {
        if (z.nodes[q].children.length) continue;
        var e2 = z.els[q], rawTxt = src.slice(e2.innerStart, e2.innerEnd);
        if (!rawTxt || rawTxt.indexOf('&') < 0) continue;
        if (S.encodeText(S.decodeEntities(rawTxt)) !== rawTxt) reenc++;
      }
      info('엔티티 표기가 재인코딩으로 달라질 수 있는 리프: ' + reenc + '개 (편집한 요소에만 영향)');

      /* 7) 라이브 DOM 정렬 */
      return loadFrame(p).then(function (f) {
        var ldoc = f.contentDocument;
        if (!ldoc) { warn('프레임 문서를 읽을 수 없어 정렬 검사 생략'); return; }
        var map = window.YStudio.align(z.nodes, ldoc.documentElement);
        var total = z.nodes.length, paired = map.stats.paired;
        var pct = Math.round(paired / total * 100);
        log(pct >= 85, '정렬 짝 비율 ' + pct + '% (' + paired + '/' + total + ')');
        info('짝 없는 라이브 노드 ' + map.stats.unpairedLive + ' · 짝 없는 원본 노드 ' + map.stats.unpairedPristine);

        /* 진단 2: 부모는 짝이 있는데 자식이 실패한 첫 지점의 양쪽 자식 목록을 비교한다 */
        if (pct < 90) {
          var KK = window.YStudio.align.keyOf, done = 0;
          for (var d = 0; d < z.nodes.length && done < 2; d++) {
            if (map.i2l[d]) continue;
            var dn = z.nodes[d], dp = dn.parentElement;
            if (!dp) continue;
            var dpi = z.nodes.indexOf(dp);
            if (dpi < 0 || !map.i2l[dpi]) continue;
            var pl = [], ll = [], pc = dp.children, lc = map.i2l[dpi].children, x;
            for (x = 0; x < pc.length; x++) pl.push((pc[x].matches(window.YStudio.align.GHOST) ? '~' : '') + KK(pc[x]));
            for (x = 0; x < lc.length; x++) ll.push((lc[x].matches(window.YStudio.align.INJECTED) ? '~' : '') + KK(lc[x]));
            info('   [비교] 부모 ' + KK(dp));
            info('     원본 자식: ' + pl.join(' , '));
            info('     라이브   : ' + ll.join(' , '));
            done++;
          }
        }

        /* 진단 1: 짝을 못 찾은 원본 노드를 나열해 원인을 특정한다 */
        if (pct < 90) {
          var shown = 0, K = window.YStudio.align.keyOf;
          for (var u = 0; u < z.nodes.length && shown < 24; u++) {
            if (map.i2l[u]) continue;
            var nd = z.nodes[u], par = nd.parentElement;
            /* nav.js 가 DOM 에서 제거하는 노드(.cta·footer·.ynav-ph)는 짝이 없는 것이 정상 */
            if (nd.closest && nd.closest(window.YStudio.align.GHOST)) continue;
            var pidx = par ? z.nodes.indexOf(par) : -1;
            info('   미짝 #' + u + ' ' + K(nd) + '  ← 부모 ' + (par ? K(par) : '-') +
              (pidx >= 0 && map.i2l[pidx] ? ' [부모 짝 있음]' : ' [부모도 미짝]'));
            shown++;
          }
        }

        /* body 는 반드시 짝이 있어야 한다 */
        var bodyIdx = -1;
        for (var b = 0; b < z.nodes.length; b++) if (z.nodes[b].tagName === 'BODY') { bodyIdx = b; break; }
        log(bodyIdx >= 0 && !!map.liveOf(bodyIdx), 'body 짝 성립');

        /* nav.js 주입물은 짝이 없어야 한다 */
        var injected = ldoc.querySelector('.ynv');
        log(!injected || map.indexOf(injected) === null, 'nav.js 주입 헤더(.ynv)는 편집 대상 아님');
        var yft = ldoc.querySelector('footer.yft');
        log(!yft || map.indexOf(yft) === null, 'nav.js 주입 푸터(footer.yft)는 편집 대상 아님');

        /* data.js 소유 컨테이너: 컨테이너 자신은 짝이 있고, 그 자식은 짝이 없어야 한다 */
        var owned = JS_OWNED[p] || [];
        for (var o = 0; o < owned.length; o++) {
          var cid = owned[o], cont = ldoc.getElementById(cid);
          if (!cont) { warn('컨테이너 #' + cid + ' 를 라이브에서 찾지 못함(렌더 조건 미충족?)'); continue; }
          var ci = map.indexOf(cont);
          log(ci !== null, '#' + cid + ' 컨테이너 자신은 파일 소유');
          var kidsPaired = 0, kids = cont.children;
          for (var kk = 0; kk < kids.length; kk++) if (map.indexOf(kids[kk]) !== null) kidsPaired++;
          /* 파일에 자리표시자(JS 없을 때 보이는 대체 링크)가 있으면 그만큼은 짝이 생기는 것이 정상이다.
             지켜야 할 성질은 "JS 가 만든 노드에 없던 짝이 새로 생기지 않는다"이다. */
          var fileKids = (ci !== null && z.nodes[ci]) ? z.nodes[ci].children.length : 0;
          log(kidsPaired <= fileKids, '#' + cid + ' 라이브 ' + kids.length + '개 중 짝 ' + kidsPaired +
            '개 ≤ 파일 자리표시자 ' + fileKids + '개' + (kidsPaired > fileKids ? ' — JS 생성물에 짝이 생겼다' : ''));
          if (fileKids) info('   #' + cid + ' 는 파일 자리표시자를 가짐 → 편집은 datamap(데이터 필드)으로 라우팅되어야 한다');
        }

        /* 런타임 오염 지표: 라이브에 붙은 클래스가 원본에는 없어야 정상 */
        var polluted = 0, checkCls = ['in', 'vis', 'fade', 'ttl-on', 'ysub-hide'];
        for (var t2 = 0; t2 < z.nodes.length; t2++) {
          var pn = z.nodes[t2];
          for (var c2 = 0; c2 < checkCls.length; c2++) {
            if (pn.classList && pn.classList.contains(checkCls[c2])) polluted++;
          }
        }
        log(polluted === 0, '원본에 런타임 클래스 없음' + (polluted ? ' — ' + polluted + '건 발견' : ''));

        f.parentNode.removeChild(f);
      });
    }).catch(function (e) {
      log(false, p + ' 검사 중 예외: ' + (e && e.message));
    }).then(function () { paint(false); });
  }

  var chain = Promise.resolve();
  PAGES.forEach(function (p) { chain = chain.then(function () { return testPage(p); }); });
  chain.then(function () {
    head('결과');
    info('실패 ' + fails + '건 · 경고 ' + warns + '건');
    paint(true);
    document.title = (fails ? 'FAIL' : 'PASS') + ' ' + fails + '/' + warns;
    var b = document.getElementById('ysBlocker');   // load 해제 → --dump-dom 이 완성된 DOM 을 덤프한다
    if (b && b.parentNode) b.parentNode.removeChild(b);
  });
})();
</script>
</body>
</html>

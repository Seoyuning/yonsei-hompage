<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[시안 G · 관제] 교수진 디렉토리 — 연세대학교 기계공학부</title>
<meta name="description" content="연세대학교 기계공학부 전임 교수 33명의 이름·직위·연구분야·연구실·연락처를 한눈에 볼 수 있는 교수진 디렉토리입니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════════════
   시안 G — 교수진 디렉토리 (라이트 테마)
   G-console 메인 하단 라이트 블록의 디자인 언어 계승:
   흰 배경 · 네이비 제목 · 코랄 액센트 · 헤어라인 · 연회색 행.
   히어로만 네이비(흰 대형 타이틀 + 연블루 킥커).
   ═══════════════════════════════════════════════════════════ */
:root{
  --navy:#1a3d75;
  --coral:#e2593c;
  --body:#4a5a74;
  --sub:#5c6b85;
  --muted:#7b8595;
  --label:#9aa3b0;
  --dimmer:#7b8595;
  --line:rgba(10,26,51,.14);
  --line-soft:rgba(10,26,51,.08);
  --row:#f7f9fc;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --kr:"Pretendard Variable","Pretendard",system-ui,sans-serif;
  /* 6개 연구분야 색 — 라이트 배경 대비로 조정 (코랄이 주액센트) */
  --c-solid:#e2593c;
  --c-thermal:#d9822b;
  --c-manufacturing:#a8862f;
  --c-micro:#2f8d82;
  --c-optics:#3f76c0;
  --c-dynamics:#8a63b8;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--kr);
  background:#fff; color:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden; word-break:keep-all;
  line-height:1.6;
}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.skip{position:absolute;left:.6rem;top:-3rem;z-index:60;background:var(--navy);color:#fff;
  padding:.55rem 1rem;font-size:.8rem;transition:top .15s}
.skip:focus{top:.6rem}

/* ── 페이지 히어로 (네이비) ── */
.hero{background:var(--navy);color:#fff;
  padding:7rem clamp(1.2rem,.6rem + 2vw,2.6rem) 3.2rem}
.hero-inner{max-width:1320px;margin:0 auto}
.hero .kick{font-size:.85rem;font-weight:600;letter-spacing:.08em;color:#9db4d8;margin-bottom:.9rem}
.hero h1{font-weight:800;letter-spacing:-.015em;
  font-size:clamp(2.1rem,1.3rem + 2.8vw,3rem);color:#fff;line-height:1.15}
.hero .lede{max-width:40rem;margin-top:1.1rem;font-size:1rem;color:#c6d2e4;line-height:1.75}
.hero .lede b{color:#fff;font-weight:600}

/* ── 필터 바 (sticky) ── */
.filterbar{position:sticky;top:3.6rem;z-index:20;
  background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
  padding:1rem clamp(1.2rem,.6rem + 2vw,2.6rem)}
.filter-wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:.85rem}
.filter-top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.filter-search{display:flex;align-items:center;gap:.55rem;flex:1;min-width:15rem;
  border:1px solid var(--line);background:#fff;padding:.55rem .8rem;transition:border-color .15s}
.filter-search:focus-within{border-color:var(--coral)}
.filter-search svg{flex:none;color:var(--label)}
.filter-search input{flex:1;background:none;border:0;outline:none;color:var(--navy);
  font-family:var(--kr);font-size:.9rem;min-width:0}
.filter-search input::placeholder{color:var(--label)}
.filter-status{font-size:.8rem;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.filter-status b{color:var(--coral);font-weight:600}

.fchips{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.fchips-label{font-size:.78rem;color:var(--label);margin-right:.4rem;flex:none}
.fchip{display:inline-flex;align-items:center;gap:.45rem;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--sub);
  font-family:var(--kr);font-size:.8rem;
  padding:.42rem .75rem;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.fchip:hover{color:var(--navy);border-color:#b9c4d4}
.fchip .cdot{width:7px;height:7px;border-radius:50%;background:var(--chip-c,var(--coral));flex:none}
.fchip .cnt{color:var(--label);font-size:.9em}
.fchip[aria-pressed="true"]{color:#fff;background:var(--coral);border-color:var(--coral)}
.fchip[aria-pressed="true"] .cnt{color:rgba(255,255,255,.8)}
.fchip[aria-pressed="true"] .cdot{background:#fff}
.fchip-sep{width:1px;align-self:stretch;background:var(--line-soft);margin:0 .25rem}
.filter-rows{display:flex;gap:1.6rem;flex-wrap:wrap;align-items:flex-start}

/* ── 디렉토리 (데이터 행) ── */
.dir{max-width:1320px;margin:0 auto;padding:2.2rem clamp(1.2rem,.6rem + 2vw,2.6rem) 2.6rem}
.dir-legend{display:grid;
  grid-template-columns:4.6rem 220px minmax(0,1fr) 250px;
  gap:1.6rem;align-items:center;
  padding:.8rem 1.1rem;border-bottom:1px solid var(--line);
  font-size:.76rem;color:var(--label)}

.dir-list{display:block}
.row{display:grid;
  grid-template-columns:4.6rem 220px minmax(0,1fr) 250px;
  gap:1.6rem;align-items:start;
  padding:1.5rem 1.1rem;border-bottom:1px solid var(--line-soft);
  position:relative;transition:background .12s;
  scroll-margin-top:6rem}
.row:hover{background:var(--row)}
.row:target{background:rgba(226,89,60,.06);box-shadow:inset 2px 0 0 var(--coral)}

/* 아바타 — 사진(없으면 이니셜 폴백) */
.r-ava{width:4.6rem;height:4.6rem;display:grid;place-items:center;position:relative;overflow:hidden;
  background:#e8eef7;color:var(--navy);border:1px solid var(--line-soft);border-radius:3px;
  font-family:var(--kr);font-weight:700;font-size:1.02rem;line-height:1}
.r-ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ① 이름 블록 — 이름 · 직위 칩 · 영문명 */
.r-name{min-width:0}
.r-name .ko{font-family:var(--kr);font-weight:700;font-size:1.05rem;color:var(--navy);line-height:1.35;
  display:flex;align-items:center;flex-wrap:wrap;min-height:1.5rem}
.r-name .en{font-family:var(--kr);font-size:.78rem;color:var(--label);margin-top:.28rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-badges{display:inline-flex;gap:.35rem;margin-left:.55rem;vertical-align:middle}
.badge{display:inline-block;font-family:var(--kr);font-size:.68rem;font-weight:500;
  padding:.14rem .45rem;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.badge--role{border-color:var(--coral);color:var(--coral)}

/* ② 연구 블록 — 분야 배지 · 연구실명 · 위치 한 줄 */
.r-research{min-width:0}
.tag{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--body);min-height:1.5rem}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--tag-c,var(--coral));flex:none}
.r-lab{min-width:0;margin-top:.5rem}
.r-lab .lk{font-size:.88rem;font-weight:600;color:var(--body);line-height:1.45;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-lab a.lk:hover{color:var(--navy);text-decoration:underline;text-underline-offset:2px}
.r-loc{font-size:.78rem;color:var(--muted);margin-top:.3rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-loc .loclab{color:var(--label);margin-right:.25rem}
.r-loc .sep{color:var(--label);margin:0 .35rem}

/* ③ 연락 블록 — 라인 아이콘 + 텍스트 세로 스택 */
.r-contact{min-width:0;display:flex;flex-direction:column;gap:.35rem}
.r-contact .cline{display:flex;align-items:center;gap:.5rem;min-width:0;
  font-size:.8rem;color:var(--sub);transition:color .15s}
.r-contact .cline:first-child{min-height:1.5rem}
.r-contact .cline svg{flex:none;color:var(--label)}
.r-contact a.cline:hover{color:var(--coral)}
.r-contact .ct{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-contact .profile{font-size:.76rem;color:var(--muted);margin-top:.1rem;
  padding-left:calc(16px + .5rem);transition:color .15s}
.r-contact a.profile:hover{color:var(--coral)}

/* 빈 상태 */
.empty{padding:4rem 1rem;text-align:center;color:var(--muted)}
.empty .code{font-size:1.02rem;font-weight:600;color:var(--navy);margin-bottom:.6rem}
.empty p{font-size:.9rem;margin-bottom:1.4rem}
.empty button{cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--sub);
  font-family:var(--kr);font-size:.82rem;padding:.55rem 1.1rem;transition:border-color .15s,color .15s}
.empty button:hover{border-color:var(--coral);color:var(--coral)}

/* ── 분야별 분포 ── */
.breakdown{max-width:1320px;margin:0 auto;
  padding:1rem clamp(1.2rem,.6rem + 2vw,2.6rem) 3.6rem}
.breakdown h2{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:1.1rem}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem 1.6rem}
.bd-row{font-size:.78rem;color:var(--muted)}
.bd-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.35rem}
.bd-row .lab{color:var(--body)}
.bd-row .val{font-family:var(--mono);font-size:.72rem;color:var(--navy);font-variant-numeric:tabular-nums}
.bd-row .val .dim{color:var(--label)}
.bd-row .bar{height:2px;background:var(--line-soft);position:relative}
.bd-row .bar span{position:absolute;inset:0 auto 0 0;background:var(--bd-c,var(--coral))}

/* ── 반응형: 모바일 — 이니셜+이름 첫 줄, 나머지 블록 세로 스택 ── */
@media (max-width:820px){
  .dir-legend{display:none}
  .row{grid-template-columns:2.7rem 1fr;gap:.6rem 1.1rem;
    padding:1.4rem .3rem;align-items:start}
  .r-ava{grid-column:1;grid-row:1}
  .r-name{grid-column:2;grid-row:1;align-self:center}
  .r-research{grid-column:2;grid-row:2;margin-top:.15rem}
  .r-contact{grid-column:2;grid-row:3;margin-top:.35rem;padding-top:0}
  .r-lab .lk{white-space:normal}
  .r-loc{white-space:normal}
}
</style>
</head>
<body>
<a class="skip" href="#dir">교수진 목록 바로가기</a>

<main>
  <!-- 페이지 히어로 -->
  <header class="hero">
    <div class="hero-inner">
      <p class="kick">구성원</p>
      <h1>교수진 디렉토리</h1>
      <p class="lede">전임 교수 <b>33명</b>의 연구분야와 연구실, 연락처를 안내합니다.
        이름이나 연구분야로 찾아보세요.</p>
    </div>
  </header>

  <!-- 필터 바 -->
  <div class="filterbar" role="search" aria-label="교수진 필터">
    <div class="filter-wrap">
      <div class="filter-top">
        <label class="filter-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="visually-hidden">이름 · 영문명 · 연구실 · 호실 검색</span>
          <input type="search" id="pq" placeholder="이름 · 영문명 · 연구실 · 호실 검색" autocomplete="off" />
        </label>
        <span class="filter-status" id="fstatus" role="status" aria-live="polite"></span>
      </div>
      <div class="filter-rows">
        <div class="fchips" role="group" aria-label="연구분야 필터" id="cChips"></div>
        <span class="fchip-sep" aria-hidden="true"></span>
        <div class="fchips" role="group" aria-label="직위 필터" id="rChips"></div>
      </div>
    </div>
  </div>

  <!-- 디렉토리 (데이터 행) -->
  <section class="dir" id="dir" aria-label="전임 교수 디렉토리">
    <div class="dir-legend" aria-hidden="true">
      <span></span><span>이름 · 직위</span><span>연구분야 · 연구실</span><span>연락처</span>
    </div>
    <div class="dir-list" id="rows"></div>
    <div class="empty" id="empty" hidden>
      <p class="code">조건에 맞는 교수가 없습니다</p>
      <p>검색어나 필터를 바꿔 보세요.</p>
      <button type="button" id="reset">필터 초기화</button>
    </div>
  </section>

  <!-- 분야별 분포 -->
  <section class="breakdown" aria-label="분야별 교수 분포">
    <h2>분야별 교수 분포</h2>
    <div class="bd-grid" id="bd"></div>
  </section>
</main>

<script src="assets/js/data.js?v=d11"></script>
<script>
(function(){
  'use strict';

  /* ── 데이터 (공유 데이터 소스 window.YSME) ── */
  var D = window.YSME;
  var professors = D.professors;
  var clusters = D.clusters;

  /* labs: 배열 → labId 조회 맵 */
  var labs = {};
  D.labs.forEach(function(l){ labs[l.id] = l; });

  /* 연구분야 색상 토큰 (data.js 클러스터 id 기준) */
  var CVAR = { solid:'--c-solid', thermal:'--c-thermal', manufacturing:'--c-manufacturing',
               micro:'--c-micro', optics:'--c-optics', dynamics:'--c-dynamics' };

  var RANKS = ['교수','부교수','조교수'];
  var rankCount = {};
  professors.forEach(function(p){ rankCount[p.rank] = (rankCount[p.rank]||0)+1; });
  var clusterOf = {}; clusters.forEach(function(c){ clusterOf[c.id]=c; });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* 사무실 영문 → 국문 축약: "Engineering Building #3, Room C324" → "제3공학관 C324"
     매핑되지 않는 값은 원문 유지 */
  function officeKo(s){
    var m = /^Engineering\s*Building\s*#\s*([123])\s*,\s*Room\s*(.+)$/i.exec(String(s).trim());
    return m ? '제'+m[1]+'공학관 '+m[2].trim() : String(s).trim();
  }

  /* 연락 블록 16px 라인 아이콘 (stroke 1.5) */
  var ICON_MAIL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>';
  var ICON_TEL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

  var rowsEl = document.getElementById('rows'),
      emptyEl = document.getElementById('empty'),
      statusEl = document.getElementById('fstatus'),
      pq = document.getElementById('pq'),
      cWrap = document.getElementById('cChips'),
      rWrap = document.getElementById('rChips'),
      resetBtn = document.getElementById('reset');

  var state = { c:'all', r:'all', q:'' };

  /* ── URL → 초기 상태 ── */
  function parseParams(str){
    var o = {};
    String(str).replace(/^[?#!]+/,'').split('&').forEach(function(kv){
      if(!kv) return; var i = kv.indexOf('='); if(i<0) return;
      try{ o[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1)); }catch(e){}
    });
    return o;
  }
  var init = location.search ? parseParams(location.search) :
             (location.hash.indexOf('#!')===0 ? parseParams(location.hash.slice(2)) : {});
  if(init.c && clusterOf[init.c]) state.c = init.c;
  if(init.r && RANKS.indexOf(init.r)>-1) state.r = init.r;
  if(typeof init.q==='string') state.q = init.q;

  function syncUrl(){
    var parts = [];
    if(state.c!=='all') parts.push('c='+state.c);
    if(state.r!=='all') parts.push('r='+encodeURIComponent(state.r));
    if(state.q.trim()) parts.push('q='+encodeURIComponent(state.q.trim()));
    var qs = parts.length ? '?'+parts.join('&') : '';
    /* 행 딥링크 해시(#professor-id)는 보존 — :target 하이라이트·재스크롤용 */
    var keepHash = (location.hash && location.hash.indexOf('#!')!==0) ? location.hash : '';
    try{ history.replaceState(null,'',location.pathname.split('/').pop()+qs+keepHash); }
    catch(e){ if(parts.length) location.hash='!'+parts.join('&'); }
  }

  /* ── 필터 칩 렌더 ── */
  function chip(group,val,label,cvar,cnt,pressed){
    return '<button type="button" class="fchip" data-'+group+'="'+val+'" aria-pressed="'+pressed+'">'+
      (cvar ? '<span class="cdot" style="--chip-c:var('+cvar+')" aria-hidden="true"></span>' : '') +
      esc(label) + (cnt!=null ? ' <span class="cnt">'+cnt+'</span>' : '') + '</button>';
  }
  cWrap.innerHTML = '<span class="fchips-label" aria-hidden="true">연구분야</span>' +
    chip('c','all','전체',null,professors.length,state.c==='all') +
    clusters.map(function(c){ return chip('c',c.id,c.ko,CVAR[c.id],c.count,state.c===c.id); }).join('');
  rWrap.innerHTML = '<span class="fchips-label" aria-hidden="true">직위</span>' +
    chip('r','all','전체',null,professors.length,state.r==='all') +
    RANKS.map(function(r){ return chip('r',r,r,null,rankCount[r]||0,state.r===r); }).join('');
  pq.value = state.q;

  function syncChips(){
    cWrap.querySelectorAll('.fchip').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.c===state.c)); });
    rWrap.querySelectorAll('.fchip').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.r===state.r)); });
  }

  /* ── 데이터 행: [이니셜] [① 이름] [② 연구] [③ 연락] ── */
  function rowHtml(p){
    var lab = labs[p.labId] || {};
    var cl = clusterOf[p.cluster] || {};
    var labUrl = lab.site || lab.url;
    var badges = '<span class="r-badges">'
      + '<span class="badge">'+esc(p.rank)+'</span>'
      + (p.role ? '<span class="badge badge--role">'+esc(p.role)+'</span>' : '')
      + '</span>';
    /* 연구실명 — site 있으면 외부 링크, 없으면 링크 없이 표기 */
    var labLine = labUrl
      ? '<a class="lk" href="'+esc(labUrl)+'" target="_blank" rel="noopener">'+esc(lab.ko)+' <span aria-hidden="true">↗</span><span class="visually-hidden"> (새 창)</span></a>'
      : (lab.ko ? '<span class="lk">'+esc(lab.ko)+'</span>' : '');
    /* 위치 한 줄 통합 — 연구실 위치 · 사무실(국문 축약) */
    var locBits = [];
    if(lab.loc) locBits.push('<span class="loclab">연구실</span>'+esc(lab.loc));
    if(p.office) locBits.push('<span class="loclab">사무실</span>'+esc(officeKo(p.office)));
    var locLine = locBits.length
      ? '<div class="r-loc">'+locBits.join('<span class="sep" aria-hidden="true">·</span>')+'</div>' : '';
    /* ③ 연락 블록 — 이메일 · 전화 · 프로필 */
    var contact = '';
    if(p.email) contact += '<a class="cline" href="mailto:'+esc(p.email)+'">'+ICON_MAIL
      + '<span class="ct">'+esc(p.email)+'</span></a>';
    if(p.phone){
      String(p.phone).split(',').forEach(function(t){
        t = t.trim(); if(!t) return;
        var disp = t.replace(/\)/g,'-'); /* "02)2123-…" → "02-2123-…" */
        contact += '<a class="cline" href="tel:'+esc(disp.replace(/[^0-9+]/g,''))+'">'+ICON_TEL
          + '<span class="ct">'+esc(disp)+'</span></a>';
      });
    }
    if(p.detail) contact += '<a class="profile" href="'+esc(p.detail)+'" target="_blank" rel="noopener">'
      + '프로필 <span aria-hidden="true">↗</span><span class="visually-hidden"> (새 창)</span></a>';
    return '<div class="row" id="'+esc(p.id)+'" role="group" aria-label="'+esc(p.ko+' '+p.rank)+'">'
      + '<div class="r-ava" aria-hidden="true">'+esc(p.initial)
      + '<img src="assets/faculty/'+esc(p.id)+'.jpg" alt="" loading="lazy" onerror="this.remove()"></div>'
      + '<div class="r-name">'
        + '<div class="ko">'+esc(p.ko)+badges+'</div>'
        + '<div class="en">'+esc(p.en)+'</div>'
      + '</div>'
      + '<div class="r-research">'
        + '<span class="tag"><span class="dot" style="--tag-c:var('+CVAR[p.cluster]+')" aria-hidden="true"></span>'+esc(cl.ko||'')+'</span>'
        + '<div class="r-lab">'+labLine+'</div>'
        + locLine
      + '</div>'
      + '<div class="r-contact">'+contact+'</div>'
      + '</div>';
  }

  function apply(){
    var ql = state.q.trim().toLowerCase();
    var hits = professors.filter(function(p){
      if(state.c!=='all' && p.cluster!==state.c) return false;
      if(state.r!=='all' && p.rank!==state.r) return false;
      if(ql){
        var lab = labs[p.labId] || {};
        var hay = (p.ko+' '+p.en+' '+p.rank+' '+(p.role||'')+' '+(p.email||'')+' '+(p.office||'')+' '+
          (p.office?officeKo(p.office):'')+' '+
          (p.phone||'')+' '+String(p.phone||'').replace(/\)/g,'-')+' '+
          (lab.ko||'')+' '+(lab.en||'')+' '+(lab.loc||'')).toLowerCase();
        if(hay.indexOf(ql)<0) return false;
      }
      return true;
    });
    rowsEl.innerHTML = hits.map(rowHtml).join('');
    emptyEl.hidden = hits.length>0;
    statusEl.innerHTML = '전체 '+professors.length+'명 중 <b>'+hits.length+'</b>명';
    syncChips();
    syncUrl();
  }

  cWrap.addEventListener('click', function(e){
    var b = e.target.closest('.fchip'); if(!b) return;
    state.c = b.dataset.c; apply();
  });
  rWrap.addEventListener('click', function(e){
    var b = e.target.closest('.fchip'); if(!b) return;
    state.r = b.dataset.r; apply();
  });
  var deb = null;
  pq.addEventListener('input', function(){
    clearTimeout(deb);
    deb = setTimeout(function(){ state.q = pq.value; apply(); }, 120);
  });
  resetBtn.addEventListener('click', function(){
    state = { c:'all', r:'all', q:'' };
    pq.value = '';
    apply();
    pq.focus();
  });

  apply();

  /* ── 해시 딥링크(G-research 교수명 링크 등) 진입 보정 ──
     행은 JS 렌더 후 존재하므로 setTimeout으로 재스크롤(instant) */
  if(location.hash && location.hash.indexOf('#!')!==0){
    (function(){
      var tid = location.hash.slice(1);
      try{ tid = decodeURIComponent(tid); }catch(e){}
      setTimeout(function(){
        var t = document.getElementById(tid);
        if(t && t.classList.contains('row')) t.scrollIntoView({behavior:'instant',block:'center'});
      }, 0);
    })();
  }

  /* ── 분야별 분포 데이터바 ── */
  var bd = document.getElementById('bd');
  var maxC = Math.max.apply(null, clusters.map(function(c){ return c.count; }));
  bd.innerHTML = clusters.map(function(c){
    var pct = Math.round(c.count/professors.length*100);
    return '<div class="bd-row">'
      + '<div class="top"><span class="lab">'+esc(c.ko)+'</span>'
        + '<span class="val">'+c.count+' <span class="dim">· '+pct+'%</span></span></div>'
      + '<div class="bar"><span style="width:'+(c.count/maxC*100).toFixed(1)+'%;background:var('+CVAR[c.id]+')"></span></div>'
      + '</div>';
  }).join('');
})();
</script>
